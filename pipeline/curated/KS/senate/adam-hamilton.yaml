# hamiltonforkansas.com sits behind a Cloudflare human-verification
# challenge, so the pipeline could never read it. The text below was read
# off the live site by a person and quoted verbatim, same quote-anchored
# rule llmExtract.ts enforces on an automated pass: every `value` is
# traceable to its own `snippet`, nothing inferred.
#
# His page is heavily footnoted with links to news reports and third-party
# studies. Only Hamilton's OWN stated positions are recorded here -- the
# cited statistics (job-loss estimates, price studies, other members'
# bills) are someone else's reporting that his page links to, not claims
# this project is in a position to verify or publish as his platform.
# Where a bullet mixed his position with a cited figure, the quote is
# trimmed to the position itself.
#
# Transcribed section by section. Covered so far: "Protecting Kansas
# Families from Rising Energy Bills", "Protecting the Security Kansas
# Seniors Have Earned", "Housing Kansans Can Afford", "Adam's Agenda to
# Lower Health Care Costs", "Support Kansas Agriculture, Producers, and
# Consumers", "Ending the Chaos and Corruption In Washington", and
# "Strengthening Consumer Protections and Supporting Small Business", and
# "Standing with Kansas Workers".
# Upgrades a 169-character Ballotpedia stub to his campaign's own "Meet
# Adam" copy -- campaign_site outranks ballotpedia in
# campaignBioSummary.ts's waterfall, and here the longer text is also
# plainly the more informative one, so precedence and usefulness agree
# (unlike VA-2's Luria, where they didn't). Quoted as one contiguous
# verbatim span.
bio_summary:
  value: "Adam Hamilton is a Democratic candidate for the United States Senate in Kansas who has devoted his life to service. A fifth-generation Kansan, his family came to Dickinson County 147 years ago and helped build the towns of Hope and Elmo. His mother’s parents came to Wichita to work at Beechcraft, and his grandfather went on to fly for TWA.\n\nAdam grew up in Prairie Village and married his high school sweetheart, LaVon, the week after graduation. They celebrated their 44th anniversary this June. They have two daughters, a granddaughter, and two dogs.\n\nIn 1990, at 25 years old, Adam and LaVon started a church in the Kansas City area with four people in a borrowed space. For 36 years he has served as pastor of a congregation roughly equal parts Republicans, Democrats and independents, doing the work to bring people together that politicians only talk about."
  source_url: "https://www.hamiltonforkansas.com/"
  source_type: campaign_site

platform_source_url: "https://www.hamiltonforkansas.com/"
platform:
  - topic: "Energy Costs"
    value: "Wants a comprehensive, all-of-the-above energy strategy that creates jobs and increases energy independence while bringing down consumer costs"
    snippet: "We need a comprehensive, all of the above strategy that creates jobs and increases energy independence while bringing down costs for consumers today."
  - topic: "Tariffs"
    value: "Would require congressional approval for new tariffs and require publishing their real cost to American families before they take effect"
    snippet: "Adam would prevent future administrations from harming Kansans by requiring congressional approval for new tariffs, and to publish the real cost to American families before those tariffs take effect."
  - topic: "Congressional Authority Over Trade"
    value: "Argues the Constitution gives Congress responsibility over trade and that Congress should use it, saying sweeping tariffs without a vote raise prices for Kansas farmers, manufacturers and families"
    snippet: "When Washington imposes sweeping tariff taxes without a vote, the bill lands on Kansas farmers, manufacturers, and families in the form of higher prices on everything from equipment and fertilizer to groceries. The Constitution gives Congress responsibility over trade, and Congress should use it."
  - topic: "Data Centers & Ratepayers"
    value: "Would impose binding rules requiring data centers to cover their own electricity costs rather than burdening ratepayers, rather than relying on voluntary industry pledges"
    snippet: "But where some support voluntary pledges , Adam would propose binding rules and legislation."
  - topic: "Energy Production Tax Credits"
    value: "Would restore energy production tax credits, saying they increase energy independence and create good-paying jobs"
    snippet: "Stop the war on domestic energy projects and restore energy production tax credits that increase our energy independence and create good-paying jobs."
  - topic: "Land Use & Energy Siting"
    value: "Supports all-of-the-above energy production and believes Kansans should decide what happens on their land"
    snippet: "Adam supports all of the above energy production and believes Kansans should decide what happens on their land."
  - topic: "Transmission Project Bidding"
    value: "Would require competitive bidding for transmission projects instead of awarding utilities contracts at taxpayer expense"
    snippet: "Require competitive bidding processes for transmission projects instead of handing utility companies lucrative contracts at taxpayer expense."
  - topic: "Utility Oversight"
    value: "Says politicians in both parties should speak out against transmission projects awarded without competitive bidding"
    snippet: "Politicians on both sides of the aisle should speak out against harmful policies that avoid competitive bidding"

  # "Protecting the Security Kansas Seniors Have Earned"
  - topic: "Social Security & Senior Care"
    value: "Says Kansas seniors should be able to count on affordable care, stable benefits and the chance to age with dignity, and that Social Security must be protected"
    snippet: "After a lifetime of work, Kansas seniors should be able to count on affordable care, stable benefits, and the chance to age with dignity. We need to protect social security and provide real solutions for seniors."
  - topic: "Home-Based Care"
    value: "Would prioritize home-based care reimbursement, including higher reimbursement rates for home health aides and in-home care, so seniors can age at home rather than in a facility"
    snippet: "We should make it financially and logistically feasible for seniors to access the care they need while aging in place with dignity, including by increasing reimbursement rates for home health aides and in-home care services."
  - topic: "Medicare Vision & Dental"
    value: "Would expand Medicare to cover vision and dental care"
    snippet: "Expand Medicare to cover vision and dental so seniors are no longer forced to dig into their savings or skip care entirely because of holes in their coverage."
  - topic: "Tariffs & Fixed Incomes"
    value: "Argues tariffs act as a hidden tax falling hardest on seniors living on a fixed Social Security check, and would require congressional approval and cost disclosure before new tariffs take effect"
    snippet: "Requiring congressional approval before new tariffs take effect — like the Constitution requires — and publishing what those tariffs will cost families before they’re enacted, would protect the Kansans least able to bear them."
  - topic: "Elder Fraud"
    value: "Would strengthen the Justice Department's Elder Justice Initiative and give investigators resources to pursue elder fraud cases"
    snippet: "Adam would strengthen the Department of Justice’s Elder Justice Initiative and give investigators the resources to pursue these cases"

  # "Housing Kansans Can Afford"
  - topic: "Housing Affordability"
    value: "Says Congress should make it easier both to buy a home and to build one"
    snippet: "Congress should make it easier to buy a home and easier to build one."
  - topic: "Tariffs & Homebuilding Costs"
    value: "Would end tariffs he says raise homebuilding costs, and require congressional approval for future ones"
    snippet: "We must end these disastrous tariffs and require congressional approval for any future ones to bring building costs back down"
  - topic: "Modular Housing"
    value: "Would modernize and standardize regulations for modular homes to increase housing supply and lower costs"
    snippet: "Modernize and standardize regulations for modular homes in order to increase the housing supply and provide more affordable options for families."
  - topic: "Investor Home Purchases"
    value: "Would ban Wall Street and other investors from buying up single-family homes, and supports closing loopholes that let large firms split into smaller entities to evade the new limit"
    snippet: "Adam supports closing those loopholes so the rule actually protects Kansas families."
  - topic: "First-Time Homebuyer Tax Credits"
    value: "Would create tax credits for first-time home buyers and for firefighters, police officers and teachers"
    snippet: "Create tax credits for first time home buyers, firefighters, police officers, and teachers."
  - topic: "Rent Price-Fixing"
    value: "Would stop anticompetitive price collusion by landlords, including algorithmic pricing designed to reduce competition and raise rents"
    snippet: "Stop anticompetitive price collusion from landlords, including the use of algorithmic pricing designed specifically to reduce competition and drive up rent for tenants."

  # "Adam's Agenda to Lower Health Care Costs"
  - topic: "Drug Price Negotiation"
    value: "Would expand the number of drugs Medicare negotiates, speed up the timeline, extend negotiated prices to private plans, and cap out-of-pocket drug costs"
    snippet: "Adam would expand the number of negotiated drugs, speed up the timeline, and extend negotiated prices to private plans"
  - topic: "Medicaid & ACA Subsidies"
    value: "Would reverse federal Medicaid cuts and restore the enhanced ACA premium tax credits that hold premiums down"
    snippet: "Reverse the cuts to Medicaid and restore the ACA subsidies that hold premiums down."
  - topic: "Medicare Payment Reform"
    value: "Would pay one fair rate for the same outpatient service regardless of setting (site-neutral) and address Medicare Advantage overpayments, without cutting benefits"
    snippet: "Cut waste, fraud, and abuse in Medicare without touching anyone’s benefits."
  - topic: "Prior Authorization"
    value: "Would reform prior authorization so insurance paperwork cannot delay or deny care doctors say patients need"
    snippet: "he would reform prior authorization so insurance paperwork cannot delay or deny care that doctors say patients need"
  - topic: "Rural Hospitals"
    value: "Would go beyond reversing Medicaid cuts to fix insurer underpayment and keep at-risk rural hospitals open"
    snippet: "Reversing the Medicaid cuts would help, but Adam would go further to fix the underpayment and keep these hospitals’ doors open."
  - topic: "Medical Debt"
    value: "Would cap interest on medical debt, limit wage garnishment, and keep medical debt off credit reports"
    snippet: "Adam would cap interest on medical debt, limit wage garnishment, and keep medical debt off credit reports"
  - topic: "Abortion & Contraception"
    value: "Would protect the right to choose and codify access to contraception into law, and require insurers to cover over-the-counter birth control as they do prescription contraception"
    snippet: "Protect a woman’s right to choose and prevent further government interference into personal decisions by codifying the access to contraception into law. Require insurers to cover non-prescription over the counter birth control just like they cover prescription contraception."

  # "Support Kansas Agriculture, Producers, and Consumers"
  - topic: "Agricultural Tariffs & Exports"
    value: "Would eliminate tariffs harming farmers, double funding for USDA export promotion, and have Congress push for new market access agreements"
    snippet: "We should immediately get rid of tariffs that are hurting our farmers’ ability to make a living,double funding for USDA’s export promotion programs"
  - topic: "Animal Disease Response"
    value: "Would fully fund the animal disease vaccine bank, laboratory network and preparedness programs, accelerate domestic sterile-fly production, and pass the Rural Veterinary Workforce Act"
    snippet: "Congress must fully fund the animal disease vaccine bank, laboratory network, and preparedness programs; accelerate the new domestic sterile-fly production facility; and pass the bipartisan Rural Veterinary Workforce Act so rural Kansas can recruit large-animal vets."
  - topic: "Farm Bill"
    value: "Wants Congress to finally pass the full farm bill and give agriculture five years of certainty"
    snippet: "Congress needs to finish the job and give agriculture five years of certainty."
  - topic: "Agricultural Workforce"
    value: "Would reform the H-2A guest-worker program with year-round visas, lower compliance costs, and a path to legal status for existing workers"
    snippet: "Congress must reform the broken H-2A guest-worker program — permitting year-round visas that reflect modern needs, lowering compliance costs, and giving existing workers a path to legal status."
  - topic: "Domestic Fertilizer Production"
    value: "Would expand USDA's Fertilizer Production Expansion Program to increase domestic fertilizer manufacturing"
    snippet: "USDA’s Fertilizer Production Expansion Program has already invested in dozens of facilities — including in Kansas — and is being expanded with accelerated permitting. Congress should supercharge it."
  - topic: "Year-Round E15"
    value: "Supports year-round E15 ethanol blends to cut prices at the pump and build markets for Kansas corn and sorghum"
    snippet: "Cut prices at the pump with year-round E15. Homegrown ethanol blends save drivers 20 to 40 cents per gallon while building new markets for Kansas corn and sorghum."
  - topic: "Grocery Price Algorithms"
    value: "Would prohibit algorithmic and dynamic grocery pricing based on shoppers' personal information, and penalize retailers that use it"
    snippet: "We need to prohibit the practice and penalize retailers that take advantage of consumers."
  - topic: "Political Polarization"
    value: "Would seek to end policy chaos by lowering the partisan temperature and bringing Republicans and Democrats together"
    snippet: "End the policy chaos in Washington that drives economic uncertainty and volatile prices — beginning by lowering the partisan temperature, bringing Republicans and Democrats together, and showing a unified face to a global economy that looks to America for leadership."

  # "Ending the Chaos and Corruption In Washington"
  - topic: "Congressional Stock Trading"
    value: "Would prohibit members of Congress and their households from trading individual stocks, requiring assets be placed in a qualified blind trust or divested"
    snippet: "It is time we ended the practice by requiring members to place all individual stocks, bonds, commodities, cryptocurrencies, and investment assets into a qualified blind trust or divest completely."
  - topic: "Crypto & Digital Assets"
    value: "Would extend the congressional trading ban to cryptocurrency and digital assets"
    snippet: "Extend the stock trading ban to cover cryptocurrency and digital assets. While trading crypto and other digital assets may be less common than stock trading, it is still ripe for abuse by lawmakers seeking to profit from their roles in government."
  - topic: "Prediction Markets"
    value: "Would enact legislation permanently banning members and staff from gambling on prediction markets"
    snippet: "While the Senate recently passed a resolution to that effect, Congress should still enact legislation banning the practice for good."
  - topic: "Term Limits"
    value: "Supports a constitutional amendment establishing 18-year term limits for the House, Senate and Supreme Court"
    snippet: "Establishing 18-year term limits would be one of the most effective, and efficient, ways we could remake, and eventually fix, a broken Congress ."
  - topic: "Age Limits"
    value: "Would establish age limits for members of Congress and the Supreme Court"
    snippet: "Establish age limits for members of Congress and for members of the Supreme Court."
  - topic: "Residency Requirements"
    value: "Would strengthen residency requirements so members actually live among the people they represent"
    snippet: "Strengthen residency requirements for members of Congress to ensure that our elected officials actually live alongside the people they represent, and don’t just happen to own real estate in the area ."
  - topic: "Dark Money"
    value: "Would end billionaires and special interests flooding elections with dark money"
    snippet: "Put an end to billionaires and special interests flooding our elections with dark money."
  - topic: "Shutdown Pay"
    value: "Would withhold member pay during government shutdowns until a budget passes"
    snippet: "Members of Congress must face the same real-world consequences: if they don’t pass a budget in time, they don’t receive a salary until the government reopens. No budget, no pay."
  - topic: "Lobbying Ban"
    value: "Would permanently bar former members of Congress from becoming federal lobbyists and extend the cooling-off period for senior staff"
    snippet: "We need to permanently prohibit members of Congress from becoming federal lobbyists; and extend the one-year “cooling off” period for senior staff."
  - topic: "Inspectors General"
    value: "Would restore protections for Inspectors General so they cannot be removed without cause or congressional notice"
    snippet: "We must ensure that independent IGs are qualified and able to remain independent, and that they cannot be removed without cause or congressional notice."
  - topic: "Presidential Pardons"
    value: "Would limit presidential pardon power so no president can place themselves, their family or allies above the law"
    snippet: "Limit presidential pardon power. No president should be able to put themselves, their family, or their allies above the law."

  # "Strengthening Consumer Protections and Supporting Small Business"
  - topic: "Junk Fees"
    value: "Would ban hidden junk fees across industries including lodging, ticketing, telecommunications and travel"
    snippet: "Ban junk fees that companies hide from consumers across industries like lodging, ticketing, telecommunications, travel, and more. What you see should be what you pay, with no surprise at checkout."
  - topic: "Overdraft Fees"
    value: "Would restore overdraft fee protections to stop banks profiting aggressively off consumers"
    snippet: "Restore overdraft fee protections to prevent banks from aggressively profiting off consumers."
  - topic: "Private Equity Consolidation"
    value: "Would investigate private equity roll-ups in health care, housing and groceries, arguing they drive up costs for ordinary Kansans"
    snippet: "Investigate private equity consolidation in essential sectors including health care, housing, and groceries. These anticompetitive roll-ups drive up costs for ordinary Kansans."
  - topic: "Economic Development Incentives"
    value: "Would require clawback provisions on economic-development incentives so companies must deliver the jobs and investment they promised"
    snippet: "Hold big corporations accountable by requiring clawback provisions for economic-development incentives, so taxpayer dollars come with guarantees that companies deliver the jobs and investment they promised."

  # "Standing with Kansas Workers"
  - topic: "Right to Organize"
    value: "Would strengthen the right to organize and eliminate corporate loopholes, starting with the bipartisan Faster Labor Contracts Act to speed first-contract negotiations"
    snippet: "Restore equity between workers and employers by strengthening the right to organize and eliminating corporate loopholes, starting with the bipartisan Faster Labor Contracts Act to speed first-contract negotiations."
  - topic: "Labor Agency Funding"
    value: "Would fully fund the National Labor Relations Board, OSHA and NIOSH so worker-protection agencies can do their jobs"
    snippet: "Fully fund National Labor Relations Board, OSHA, and NIOSH so the agencies that protect workers’ rights and safety can actually do their jobs."
  - topic: "Wage Theft"
    value: "Would crack down on wage theft through harsher penalties and stronger Department of Labor enforcement"
    snippet: "Crack down on wage theft — unpaid overtime, minimum-wage violations, illegal deductions, and stolen tips — through harsher penalties and stronger Department of Labor enforcement."
  - topic: "AI in Employment Decisions"
    value: "Would protect workers from AI-only employment decisions, requiring human review of hiring, firing and promotions"
    snippet: "Protect workers from AI-only employment decisions without human oversight. The No Robot Bosses Act would require real human review of hiring, firing, and promotions."
