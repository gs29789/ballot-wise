# electemilyrandall.com sits behind a Cloudflare human-verification
# challenge, so the pipeline could never read it (confirmed live this
# session: /issues/ redirects to a "Just a moment..." interstitial). The
# text below was read off the live "Issues" page by a person and quoted
# verbatim, same quote-anchored rule llmExtract.ts enforces on an
# automated pass: every `value` is traceable to its own `snippet`,
# nothing inferred.
#
# Transcribed section by section; covered so far are "Fighting Climate
# Change", "Lowering Costs for Families", "Defending Democracy",
# "Enhancing Healthcare", "Improving Education", and "Safeguarding Access
# to Abortion". Sentences with no self-attributed action -- generic
# values framing ("critical moment for our democracy," "too much wealth
# in too few hands," "no one should go bankrupt" on its own), closing
# campaign-rhetoric restatements of a point already captured earlier in
# the same section, and one "too many in Congress" line that criticizes
# Congress in general rather than a named opponent or stating her own
# commitment -- are excluded per this file's standing rule against
# generic framing with no concrete commitment; every sentence that states
# a distinct position or fact is kept. One real run-on sentence in
# "Safeguarding Access to Abortion" (missing a "to" before "support," a
# missing connector between "abortions" and "require") is quoted exactly
# as published rather than silently cleaned up, same as this project's
# other real page quirks.
platform_source_url: "https://www.electemilyrandall.com/issues/"
platform:
  # "Fighting Climate Change"
  - topic: "Fossil Fuel Transition & Clean Energy Investment"
    value: "Wants a just and fair transition away from fossil fuels and investment in clean energy jobs and infrastructure"
    snippet: "We must make a just and fair transition away from fossil fuels and invest in clean energy jobs and infrastructure."
  - topic: "Worker Transition & Sustainable Economy"
    value: "Will work with labor and industry to help workers gain new skills for the changing economy, and is committed to a sustainable economy focused on renewable energy and climate-neutral industry that protects vulnerable communities"
    snippet: "I will work closely with labor and industry to find ways for workers to gain new skills and transition to the jobs that our changing economy and environment needs. I am committed to building an economy that is sustainable, and that protects those among us most vulnerable to the impacts of climate change. We must focus on renewable energy, and climate-neutral industry that protects not only today’s economy, but the ability for our grandchildren to live and work as well."
  - topic: "Green Transportation & Grid Modernization"
    value: "Says the communities most impacted by climate change have the least means to survive it, and has led efforts to ensure a just transition to a greener transportation system and adapt the electrical grid for a greener economy"
    snippet: "We know that the communities that will be most impacted by climate change are the ones with the least means to survive it. This is why I have been a leader in ensuring a just transition to a greener transportation system and adapting our electrical grid to the needs of a greener economy."

  # "Lowering Costs for Families"
  - topic: "Middle-Class Economic Policy"
    value: "Believes in an economy that works from the middle class out, not trickle-down, putting working families at the center of economic policy"
    snippet: "I believe in an economy that works from the middle class out–not trickle down–putting working families at the center of economic policies."
  - topic: "Fair Wages & Big Business Taxes"
    value: "Believes in equal pay for equal work, a tax structure requiring big business to pay its fair share, and creating good jobs by investing in small and mid-sized businesses"
    snippet: "I believe in equal pay for equal work, a tax structure that requires big business to pay its fair share, and in creating good jobs by investing in small and mid-sized businesses."
  - topic: "Blockchain & Digital Assets"
    value: "Believes in driving technological innovation and economic growth, including through blockchain technology and the digital asset industry"
    snippet: "I believe in the importance of driving technological innovation and economic growth, including through blockchain technology and the digital asset industry."
  - topic: "Economic Opportunity for Marginalized Communities"
    value: "Believes in removing barriers to economic freedom and opportunity for marginalized communities including communities of color, LGBTQ people, and the disability community"
    snippet: "I believe in removing the barriers to economic freedom and opportunity for our most marginalized communities such as communities of color, LGBTQ folks, and the disability community."
  - topic: "Regulatory Framework for Innovation & Consumer Protection"
    value: "Wants to create jobs and grow the economy through comprehensive regulatory frameworks that encourage innovation while protecting consumers"
    snippet: "We can create more jobs and grow our economy through comprehensive regulatory frameworks that encourage innovation while protecting consumers."

  # "Defending Democracy"
  - topic: "Voting Access"
    value: "Says ensuring all eligible voters have access to the ballot box is where protecting democracy starts, and will continue fighting to remove barriers to voting"
    snippet: "This starts with ensuring that all eligible voters have access to the ballot box. I will continue to fight to remove barriers to voting and ensure every citizen’s voice is heard."
  - topic: "No Corporate PAC Money"
    value: "Has not taken corporate PAC money since she started running for office"
    snippet: "I am a part of the community I am running to represent–I see my constituents at the grocery store, and one thing that I consistently hear is that they appreciate the stand I’ve taken against taking corporate PAC money since I started running for office."

  # "Enhancing Healthcare"
  - topic: "ACA & Medicaid"
    value: "Draws on her family's experience relying on Medicaid for her sister Olivia's critical care, and as a member of Congress will work to protect and strengthen the ACA, increase Medicaid flexibility so states can expand coverage, lower out-of-pocket medication costs, and invest in healthcare staffing and infrastructure"
    snippet: "My family was only able to afford critical care for my younger sister when she was with us because, in addition to my dad’s government employee health insurance, Olivia qualified for Medicaid. I want to ensure that every family has these same opportunities for their loved ones. As a member of Congress, I will work hard to protect and strengthen the ACA, increase the flexibility of Medicaid dollars so that states like Washington can continue expanding coverage,  bring down the out of pocket cost on medication, and invest in staffing critical healthcare positions and infrastructure so people have more than just theoretical access to the care they need."
  - topic: "Healthcare Provider Access"
    value: "Has been a leader in Washington state in expanding access to healthcare providers, including comprehensive reproductive healthcare and gender-affirming care"
    snippet: "I have been a leader in Washington in expanding access to healthcare providers and ensuring that people have more than just theoretical access to essential healthcare including comprehensive reproductive healthcare and gender affirming care."
  - topic: "Universal Healthcare Commission"
    value: "Sponsored the legislation creating Washington's Universal Healthcare Commission, saying no one should go bankrupt to pay for lifesaving or palliative care"
    snippet: "I know firsthand just how devastating healthcare costs can be to working class families and no one should go bankrupt to pay for lifesaving or palliative care which is why I sponsored the legislation creating Washington’s Universal Healthcare Commission."

  # "Improving Education"
  - topic: "Higher Education Affordability"
    value: "As Senate Chair of the Higher Education and Workforce Development Committee, has focused on opening doors for all students and helped make Washington State one of the most affordable states for college while strengthening its apprenticeship and career training system"
    snippet: "As the Senate Chair of the Higher Education and Workforce Development Committee, I have focused on opening doors wider for all students, and ensuring that whichever path a student chooses is well supported. We’ve made Washington State one of the most affordable states in which to go to college, while also strengthening our apprenticeship and career training system."
  - topic: "Medical School Diversity & Health Equity"
    value: "Passed policies to increase diversity in medical school admissions, ensure culturally competent and affordable patient care, and expand the Latino Centers for Health at the University of Washington"
    snippet: "I’ve also passed policies that help increase diversity in medical school admissions, ensure patients receive affordable and culturally competent care, and  worked to expand the Latino Centers for Health at University of Washington."
  - topic: "Equal Access & Debt-Free Pathways"
    value: "Believes in equal access to good schools and well-compensated teachers regardless of zip code or family background, and that all post-high-school pathways -- college or apprenticeship -- should prepare students for the job market without saddling them with insurmountable debt"
    snippet: "I believe in equal access to good schools and well-compensated teachers no matter our zip-code or family background. Every student deserves a quality education from pre-K to post-high school. And that post-high school path might be college and it might be an apprenticeship, but it should prepare students for tomorrow’s job market without saddling them with insurmountable debt."

  # "Safeguarding Access to Abortion"
  - topic: "Reproductive Health Policy Record"
    value: "Cites passing Reproductive Health Access for All in 2019, ensuring student health plans covered abortion care, ending cost sharing, and preserving access to mifepristone as part of a record of leadership on reproductive health policy in Washington, done in coalition with reproductive justice partners, and will continue that work in Congress"
    snippet: "From passing Reproductive Health Access for All in 2019, to working to ensure student health plans covered abortion care, to ending cost sharing, to preserving access to mifepristone, I have been a leader on reproductive health policy in Washington – and have worked in coalition with reproductive justice partners. I will continue that work – as a coalition builder and a policy maker – in DC."
  - topic: "Reproductive Healthcare Legislation"
    value: "Sponsored legislation to block religious hospital mergers that reduce reproductive and gender-affirming care access, extend postpartum healthcare coverage for birthing parents for a full year, and expand which healthcare professionals can perform abortions and require health plans to cover reproductive healthcare and contraception"
    snippet: "I have sponsored legislation to block religious hospital mergers that lead to reduced reproductive healthcare and gender affirming care access; extend postpartum healthcare coverage support birthing parents for a full year after giving birth; expand the types of healthcare professionals who can perform abortions require all health plans to cover reproductive healthcare and contraception; and many other pieces of legislation expanding access to healthcare generally and reproductive freedom specifically."
  - topic: "Crisis Pregnancy Center Regulation"
    value: "Works with reproductive care providers and advocates to expand access to reproductive healthcare, including regulating crisis pregnancy centers ('fake clinics') in 2024"
    snippet: "I work closely with reproductive care providers and advocates to find more ways to expand and protect access to this essential aspect of basic healthcare – including regulating CPCs/fake clinics in 2024!"
  - topic: "Pro-Choice Voting Record"
    value: "Has a 100% lifetime pro-choice voting record"
    snippet: "I am proud to have a 100% lifetime pro-choice voting record."
