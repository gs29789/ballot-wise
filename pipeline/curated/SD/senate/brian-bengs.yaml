    snippet: "Brian Bengs served in the U.S. Navy and the U.S. Air Force. Bengs earned a bachelor's degree in history and international studies from Iowa State University in 1994, a juris doctor from the University of Iowa in 1996, a master's degree in history from Louisiana Tech University in 2007, and a master's degree in international and comparative law from George Washington University in 2007. His career experience includes working as an assistant professor with Northern State University and the chief of general law/assistant general counsel with the U.S. Air Force."
