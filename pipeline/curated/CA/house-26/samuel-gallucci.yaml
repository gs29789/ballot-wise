platform_source_url: "https://samgallucci.com/"
platform:
  - topic: "Affordability"
    value: "Wants to lower the cost of living, addressing housing, food, energy, and insurance costs for Ventura County families and seniors."
    snippet: |
      Families are squeezed by housing, food, energy, and insurance costs. Sam will fight to make Ventura County affordable for all, from seniors to our young people.
  - topic: "Government Reform"
    value: "Wants to rebuild public trust in institutions through good-faith reform."
    snippet: |
      Most Americans have lost trust in our institutions, and for good reason – they are constantly being deceived and failed. Sam wants these institutions to thrive and re-earn trust through good faith reform.
  - topic: "Education"
    value: "Believes every child deserves a high-quality education and holds parents' rights as his guiding principle in education."
    snippet: |
      Sam believes every child deserves a high-quality education. Sam holds parents' rights as his guiding principle in education.
  - topic: "Ending Homelessness"
    value: "Draws on decades of hands-on experience through his non-profits, favoring treatment, housing tied to progress, and coordinated care."
    snippet: |
      Sam has decades of hands-on experience helping people off the streets through his non-profits. He knows what works: treatment, housing tied to progress, and coordinated care.
  - topic: "Immigration"
    value: "Supports a secure border alongside a legal, fair, humane immigration system, framed as a 'National Settlement on Immigration.'"
    snippet: |
      We need a secure border and a legal, fair, humane system. Sam will fight to pass his vision for a 'National Settlement on Immigration.'
  - topic: "Economy & Small Business"
    value: "Draws on corporate and non-profit experience to support small business, jobs, and innovation."
    snippet: |
      Having experience in corporate America and in the community with his non-profits, Sam knows what it takes to make our businesses thrive.
  - topic: "Veterans & Military Families"
    value: "Wants world-class care and post-service opportunities for veterans, citing suicide among veterans as an urgent concern."
    snippet: |
      Ventura County's veterans deserve world-class care and opportunities after service. The hard truth is that more soldiers die from the battles within than the wars abroad. That must end.
  - topic: "Public Safety"
    value: "Supports law enforcement, first responders, and community-based prevention as linked to public health."
    snippet: |
      Safety and health go hand in hand. Sam backs law enforcement, first responders, and community-based prevention.
  - topic: "Seniors & Families"
    value: "Views strong families as the foundation of a strong community and country."
    snippet: |
      Strong families are the building block of a strong community and a strong country.
  - topic: "Environment & Coast"
    value: "Supports practical, science-guided stewardship of the coast, forests, and water reliability."
    snippet: |
      Local stewardship matters. Sam will defend our coast, forests, and water reliability with practical, science-guided solutions.
