# Curated rather than auto-extracted for an unusual reason worth recording:
# Cisneros is the SITTING Representative for CA-31 and is running for that
# same seat, but FEC classifies him as "Challenger" (his committee is still
# under the 2018 CA-39 filing ID above), so the build never matches him to a
# congress.gov member. That gate is what supplies bioguide_id, and with it
# the official-.gov platform fallback -- so his own house.gov issues page was
# never tried, and his campaign site is behind a Cloudflare challenge. Quoted
# verbatim from his official site 2026-09-03; identity confirmed on-page
# ("Representative Gil Cisneros", "California's 31st Congressional District").
