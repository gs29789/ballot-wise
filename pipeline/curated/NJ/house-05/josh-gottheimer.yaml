bio_summary:
  value: "Josh was raised in North Caldwell, the son of a preschool teacher and a small business owner. Growing up, Josh worked in his father’s store and, like your average New Jersey kid, treasured summer vacations at the Jersey Shore. His first concert was at the Meadowlands to see the one and only Bruce Springsteen!\n\nJosh graduated from West Essex High School before attending the University of Pennsylvania, later becoming a Thouron Fellow at Oxford, and then paid his way through Harvard Law School."
  source_url: "https://josh4jersey.com/about/"
  source_type: campaign_site
