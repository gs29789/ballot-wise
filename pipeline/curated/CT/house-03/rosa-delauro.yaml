platform:
  - topic: "Energy"
    value: "Supports developing clean/renewable energy and reducing energy waste; champions the Weatherization Assistance Program and LIHEAP to help families afford energy costs; supported the Inflation Reduction Act's clean energy investments aiming to cut carbon emissions roughly 40% by 2030; introduced the National Infrastructure Development Bank Act to help finance energy transmission, efficiency, and storage projects."
    snippet: |
      Hardworking Americans are already living paycheck to paycheck, and energy is contributing to this cost-of-living crisis. The U.S. needs a comprehensive energy plan that prioritizes domestic energy sources that create jobs here at home. That is why Rosa supports the development of the next generation of clean and renewable energy sources and reducing our energy waste through efficiency improvements.
      Driving Down Costs

      We need an energy policy that works for American families. The rising cost of living puts a squeeze on families' finances, forcing them to make difficult choices between putting food on the table, keeping the lights on, or ensuring they can heat their homes during the colder months.

      Workers cannot get ahead when energy costs increase faster than wages. That is why Rosa is a strong supporter of investments in energy efficiency, including the Weatherization Assistance Program. She is also a major champion of the Low-Income Home Energy Assistance Program (LIHEAP), which helps ensure that Connecticut homes stay warm during the winter months and workers can continue to provide for their families without having to make difficult decisions between what bills to pay or not to pay.
      Clean and Renewable American Energy

      Currently, 83 percent of the energy used in the U.S. comes from fossil fuels—leaving our economy largely dependent upon foreign energy imports. For economic, national security, and environmental reasons, we need to shift away from fossil fuels and diversify with investments in the next generation of clean and renewable energy technologies.

      Shifting toward domestically produced energy will also create good paying jobs here at home and increase our nation's energy security. Rosa proudly supported the Inflation Reduction Act, which made historic investments to reduce the deficit, invest in domestic energy production and manufacturing, and tackle the climate crisis by reducing carbon emissions by roughly 40 percent by 2030.

      One common barrier faced by many renewable energy companies is financing, which is one reason why Rosa introduced the National Infrastructure Development Bank Act. This bill would provide financing for a wide range of energy projects, including energy transmission, energy efficiency enhancements for existing building, renewable energy, and energy storage.
  - topic: "Health Care & The Affordable Care Act"
    value: "Strong supporter of the ACA; as senior Democrat on the HHS appropriations subcommittee, works to ensure strong funding for affordable health care programs; the ACA ended pre-existing condition denials and lifetime coverage limits and made preventive care services (mammograms, colonoscopies, diabetes/cholesterol screenings) available with no out-of-pocket costs."
    snippet: |
      Rosa is determined to make health care more affordable for all Americans and is a strong supporter of the Affordable Care Act. As the senior Democrat on the subcommittee responsible for funding the Department of Health and Human Services, Rosa seeks to ensure strong funding levels for programs that help improve access to quality, affordable health care.

      The Affordable Care Act

      The Affordable Care Act has helped millions of Americans access more affordable health care, while reducing long-term health care costs. Insurance companies will now be held accountable – it is no longer acceptable to deny care and coverage for pre-existing conditions, impose lifetime coverage limits, or enact excessive premium increases. Recommended preventive care services – things like mammograms, colonoscopies, and cholesterol and diabetes screenings – are covered by insurance with no out-of-pocket costs. These services and the other changes because of the new law have the potential to save lives, and to transform our health care system.
  - topic: "Biomedical Research"
    value: "A 30-year ovarian cancer survivor, advocates for NIH and CDC biomedical research funding, citing NIH's $1-to-$2 business-activity return on investment; supports funding for graduate/professional school education grants and public health surveillance."
    snippet: |
      A 30-year survivor of ovarian cancer, Rosa is a leading advocate for funding biomedical research, including studies supported by the National Institutes of Health (NIH) and the Centers for Disease Control and Prevention (CDC). She works with colleagues to raise awareness of the need to invest in this work to save lives. This research is also critical to job growth, as every $1 invested in the NIH has been found to result in an additional $2 of business activity. This includes research supported by the NIH, surveillance supported by the CDC, grants that support graduate and professional school education, and numerous other critical programs.
  - topic: "Women's Health"
    value: "Worked to reauthorize Johanna's Law on gynecologic cancer awareness; introduced the Birth Defects Prevention, Risk Reduction, and Awareness Act and the Breast Density and Mammography Reporting Act; advocates for the Breast Cancer Patient Protection Act to keep hospital-stay decisions with patients and doctors, not insurers."
    snippet: |
      Rosa worked to reauthorize Johanna's Law, ensuring women and their health care providers have access to information about gynecologic cancers, enabling earlier detection of these cancers in an effort to save lives. She introduced the Birth Defects Prevention, Risk Reduction, and Awareness Act to ensure that women and their health care providers have information about the potential impacts of medications, chemicals, foodborne illness, and other exposures to themselves and their infants. Rosa also introduced the Breast Density and Mammography Reporting Act which would ensure that women and their health care providers have access to the information about an individuals' breast density to make informed health care decisions. She also continues to advocate for passage of the Breast Cancer Patient Protection Act, a bill that would ensure that decisions about a woman's hospital stay are made by the woman and her health care provider, not an insurance company.
  - topic: "Jobs and Economy"
    value: "Prioritizes job creation and rebuilding the middle class, citing wage stagnation and income inequality trends (CBO data cited); points to Connecticut job losses from trade deficits and infrastructure deficiencies in bridges, roads, and drinking water systems; supports investment in small business, manufacturing, infrastructure, education, and scientific research to create sustainable middle-class jobs."
    snippet: |
      With over 13 million unemployed across the country and a high unemployment rate in Connecticut, Rosa's top priority continues to be putting people back to work. Only by creating good middle class jobs and setting a new direction for our economy can we hope for sustainable economic growth that allows us to compete in a 21st century global economy.

      From supporting innovative small business and our manufacturing base to investments in education and scientific research, we must address the immediate jobs crisis and lay the foundation to create good, sustainable middle class jobs that cannot be outsourced and will lead to long-term economic growth.

      According to the non-partisan Congressional Budget Office, middle-class and working-class Americans have seen their wages stagnate and median income fall over the past thirty years, even as the top 1% of Americans have seen their income triple to 23% of the total. Meanwhile 1 in 6 Americans are living in poverty.

      We are also seeing more and more good jobs shipped overseas. According to the Economic Policy Institute, we have lost over 31,000 jobs in Connecticut, including 6,000 jobs in the 3rd District, over the last decade due to our trade deficit with China alone. At the same time, our infrastructure, the lifeblood of any economy, is crumbling with the American Society of Civil Engineers noting that, among other things, 35% of Connecticut's bridges are structurally deficient or functionally obsolete, 47% of our major roads are in poor or mediocre condition, and we need an investment of $653 million over the next 20 years in our drinking water infrastructure.

      Rosa's plan aims to create jobs now and well into the future; preserves existing jobs and prevents unjust barriers to employment; builds the foundations for long-term growth by rebuilding our infrastructure and reviving the manufacturing sector; and helps working families to ensure they get the pay and benefits they deserve. Support for small businesses, innovative research and education is critical to creating jobs.
  - topic: "National Security & Defense Manufacturing"
    value: "Supports strong veteran/military benefits including living wages and health care; has supported major defense programs sustaining Connecticut jobs (Black Hawk, Marine One, CH-53K helicopter, Joint Strike Fighter engine programs); fought to ensure military equipment contracts (Marine One, Air Force Aerial Refueling Tanker) go to American companies; led efforts to require competitive bidding on Defense Department helicopter contracts rather than no-bid purchases from Russian arms dealers."
    snippet: |
      The brave men and women serving this country deserve not only our gratitude, but also strong benefits including a living wage and health care for themselves and their families.This support should include providing the best equipment, much of which is manufactured in Connecticut. At the same time, the decision of whether to go to war is the most solemn decision a Member of Congress makes, and our troops deserve thoughtful consideration of when, where and how to deploy our military to meet our security challenges.

      Supporting Connecticut's Defense Industrial Base

      From early 19th century production of firearms to today's manufacturing of helicopters, jet engines, submarines, and more, Connecticut has always played a central role in providing our troops with the equipment they need. Defense manufacturing today is a critical source of high skilled jobs in Connecticut's Third District.

      Rosa has always supported defense programs that maintain jobs in Connecticut, including the Black Hawk, Marine One Presidential, Combat Rescue and CH-53K heavy-lift helicopter programs, as well as the procurement of engines for the C-17, F-22, F-35 Joint Strike Fighter and other aircraft. Rosa as been an advocate for the Joint Strike Fighter primary engine, with testing and assembly of that engine taking place in Middletown, and played a lead role in terminating the alternate engine program.

      Rosa is also a leader in ensuring that our military is procuring American-made equipment. She fought for re-bids of contracts for both the Marine One and Air Force Aerial Refueling Tanker originally awarded to European companies. The final Tanker contract was awarded to a U.S. company which will create jobs in Connecticut and the Marine One is now scheduled to be re-bid.

      Rosa is also fighting to end the Defense Department's no-bid purchases of helicopters for the Afghan Security Forces from the Russian state arms dealer Rosoboronexport. That firm is providing weapons to Syrian President Bashar al-Assad allowing the regime to commit atrocities against innocent men, women and children. Rosa successfully led an amendment to the 2013 Defense Authorization bill that would prohibit the Defense Department from entering into such contracts and requiring any such future contract to be competitively bid.
  - topic: "Individual Tax Code"
    value: "Supports tax cuts for middle-class families on income up to $250,000 while letting rates for the top 2% return to Clinton-era levels; supported the 2012 payroll tax cut extension and the \"Buffett Rule\" ensuring million-dollar earners don't pay a lower rate than others; has fought to expand the Child Tax Credit for working families."
    snippet: |
      Rosa supports a tax code that bolsters middle class families while asking the wealthiest Americans to pay their share. Rosa also believes in a tax code that lays the foundation for small businesses to succeed while providing incentives for corporations to invest in the United States rather than overseas.

      Individual Tax Code

      Rosa supports tax cuts for middle class families on income up to $250,000, while allowing the tax rates for the wealthiest 2% of Americans, to return to the Clinton-era rates. Ending tax cuts for the richest 2% would reduce the deficit by $930 billion over 10 years.

      Rosa also supported an extension of the payroll tax cut in 2012 to ensure that 160 million American workers, including 2 million people in Connecticut, did not see an average $1,500 tax increase. She also supports legislation, the "Buffett Rule", ensuring the highest-earning Americans with an annual income of over $1 million do not pay a lower tax rate than everyone else.

      Rosa believes in a progressive tax code that supports working low income and middle class families. Throughout her career, Rosa has fought to expand the Child Tax Credit (CTC) to provide greater tax relief to working families. In 2009, Rosa fought to decrease the eligibility threshold for the CTC from $12,550 to $3,000 providing an increased credit of up to $1,432.50 to the families of 15.9 million children, including 5.5 million newly eligible children. In Connecticut, 116,000 children are benefiting from the expanded credit.
  - topic: "Small Business Tax Cuts"
    value: "Supports expanded small business equipment write-offs and eliminating capital gains tax for small businesses; introduced the Manufacturing Reinvestment Account Act allowing manufacturers to make tax-advantaged pre-tax contributions for equipment and job training investment."
    snippet: |
      Rosa supports maintaining and expanding tax cuts for our small businesses. She supports legislation to help small businesses quickly recover the cost of capital expenses by writing off up to $250,000 for purchases of new equipment of up to $800,000. Rosa also supported legislation that eliminated the capital gains tax for small businesses and increased the amount of start-up expenditures entrepreneurs can deduct from their taxes from $5,000 to $10,000.

      Rosa also introduced the bipartisan Manufacturing Reinvestment Account Act, which would allow manufacturing firms to establish a manufacturing reinvestment account (MRA), similar to an individual retirement account (IRA), in a community bank and to make annual pre-tax contributions of up to $500,000 that may be held in the MRA for up to 7 years. Amounts distributed from the MRA are effectively taxed at a low 15 percent rate and must be used to purchase equipment and facilities or for job training.

      If a small manufacturing business invested $500,000 a year for 7 years in an MRA bearing a 5 percent interest rate, it would have an estimated after-tax balance of approximately $3.6 million to invest in equipment, facilities, and job training at the end of the investment period. That amount would represent approximately $1 million more than had the same amount initially been invested in a taxable account.
  - topic: "Corporate Tax Code"
    value: "Opposes tax incentives that encourage outsourcing jobs overseas; introduced the Rebuild America Act to eliminate tax breaks for companies that ship jobs overseas; co-sponsors the Stop Tax Haven Abuse Act; fought to bar companies incorporated in overseas tax havens from receiving federal contracts."
    snippet: |
      Rosa believes that incentives and loopholes in the tax code that encourage multinational corporations to ships jobs overseas and pursue strategies to avoid U.S. taxes hamper U.S. job creation and economic growth. She believes that corporate tax reform should level the playing field for all our businesses and be implemented in such a way so that U.S. multinational corporations that have outsourced jobs and investment overseas are incentivized to invest in American workers to create good, well-paying middle class jobs at home.

      Rosa introduced the Rebuild America Act, which would eliminate tax breaks for companies that ship jobs overseas. She is also a co-sponsor of the Stop Tax Haven Abuse Act, which would curb abuses of the international tax laws that cost hardworking middle class families and small businesses who play by the rules nearly $100 billion a year. Rosa also successfully fought for legislation to bar corporations that incorporate in overseas tax havens from receiving Federal Government contracts.
  - topic: "Food Safety"
    value: "Senior Democrat on the subcommittee funding USDA/FDA and co-chairs the Congressional Food Safety Caucus; a lead author of the 2011 Food Safety Modernization Act (mandating high-risk facility inspections, preventive measures, food tracing, import safety standards); supports consolidating food-safety oversight (currently spread across 15 agencies and 30+ laws) into a single food safety agency."
    snippet: |
      With more than 48 million illnesses, 128,000 hospitalizations, and 3,000 deaths from foodborne disease each year, food safety is critical for the health and well-being of American families. As a senior Democrat of the subcommittee responsible for funding the U.S. Department of Agriculture and the U.S. Food and Drug Administration, Rosa fights for policies that ensure the safety of our food. Rosa also co-chairs the Congressional Food Safety Caucus, which works to prevent foodborne illnesses.

      Food Safety Modernization Act

      Rosa is a leader in writing the Food Safety Modernization Act, which became law in 2011. The legislation contained several key provisions she championed, including mandating regular inspections of high-risk industrial food facilities, requiring food companies to take preventive measures, establishing a better system for tracing food, and demanding that imported food meet our safety standards.

      As the Food Safety Modernization Act is implemented, Rosa is working to ensure that the new rules and regulations protect the health of American consumers. With the ever-increasing quantity of imported foods, Rosa is also fighting for the resources and authorities needed to make sure that these foods are safe for consumers and that our trade agreements make food safety a priority.

      Streamlining our Food Safety System

      Responsibility for our nation's food safety is stretched across 15 federal agencies responsible for enforcing at least 30 laws, making it impossible to efficiently respond to the safety issues of today's global and complex food system. Rosa believes that we must streamline this process, which is why she has long sponsored legislation that would establish a single food safety agency with a comprehensive and coordinated mission to protect America's families from foodborne illness.
  - topic: "Drug and Medical Device Safety"
    value: "Works to ensure FDA can regulate, test, and assure the safety of drugs (noting roughly 40% of U.S. drugs and 80% of drug ingredients are produced overseas); advocates for improved medical device approval processes, post-market surveillance, and safety classification/labeling standards."
    snippet: |
      The safety and effectiveness of medications in the U.S. is a critical component of the nation's healthcare system. Almost 40 percent of drugs taken in the U.S. are produced overseas and 80 percent of all drug ingredients come from foreign countries. Americans trust and rely on these products to take care of themselves and their families. Rosa works to ensure that the FDA can regulate, test, and assure the safety of the drugs that are used in hospitals, doctor's offices, and homes across the country.

      Medical device safety is another critical area in which Rosa works to protect American patients. Medical devices range from bandages and tongue depressors, to tanning beds, pacemakers, and artificial joint implants. Rosa is working to ensure the safety and efficacy of the approval processes for medical devices, as well as for improved safety standards, post-market surveillance, and appropriate classification and labeling of medical devices to protect patients and consumers.
  - topic: "Gun Violence Prevention"
    value: "Supports universal background checks, an assault weapons ban, research into gun violence as a public health issue, and holding gun manufacturers accountable; member of the House Gun Violence Prevention Task Force; introduced the SAFER Streets Act offering a $2,000 tax credit for individuals who voluntarily turn in assault weapons to state police; also supports expanded mental health care funding and resources."
    snippet: |
      Congress has a moral responsibility to enact universal background checks, ban assault weapons, allow research on gun violence, keep guns out of the hands of potential terrorists, and hold gun manufacturers accountable for crimes committed with their weapons. Rosa also believes that we must improve our mental health care system, provide additional mental health resources, and fund mental health programs sufficiently, so that people get the help they need.

      Gun Violence Prevention Task Force

      As a member of the Gun Violence Prevention Task Force in the House of Representatives, Rosa remains committed to working with other Members of Congress, mental health experts, law enforcement organizations, teachers, gun owners, and others to pursue a comprehensive approach to reducing gun violence and strengthening our nation's laws.

      Research on Gun Violence

      At a time when the American Medical Association has called gun violence in the U.S. a 'public health crisis,' research has the potential to save lives by unlocking the capabilities of one of our government's great research institutions. However, this research is currently banned by Congress. Rosa believes that if we research other public health risks—cigarettes, auto accidents, and addiction—in order to curb the damage they do to our society, we should research gun violence as well. Even Jay Dickey – the former Republican Congressman who led efforts to ban federal research – agrees, 'Doing nothing is no longer an acceptable solution.' Now is the time for Congress to act.

      SAFER Streets Act

      Currently, gun buyback programs operate around the country with the intention of reducing the number of assault weapons. However, gun buyback programs are administered at the local level, and with states continuing to face budget cuts, funding these programs is becoming more difficult. In order to better succeed in getting these military-style guns off the street, Rosa introduced the SAFER Streets Act, which would incentivize owners of assault weapons to turn in their weapons by offering a $2,000 tax credit for two years to an individual who voluntarily turns in their assault weapon to state police.
  - topic: "Help Struggling Families Avoid Foreclosure"
    value: "Supports foreclosure relief and homeownership incentive programs; introduced the Regulation of Mortgage Servicing Act to extend mortgage servicing protections (loan modifications, foreclosure alternatives) to all homeowners, building on the National Mortgage Foreclosure Settlement's provisions for Connecticut borrowers."
    snippet: |
      We are now more than five years into one of the worst housing and foreclosure crises in American history, with millions of families still at serious risk of losing their homes. Since 2006, home prices in Connecticut have decreased by -29.55%.

      Rosa supports initiatives to immediately help struggling families at risk of foreclosure and programs to incentivize homeownership. These programs will help restore home values and support the recovery of the housing market.

      Help Struggling Families Avoid Foreclosure
      Foreclosures rates are still at record levels, with over one in ten homeowners with a mortgage in foreclosure or at risk of falling into foreclosure. The recent National Mortgage Foreclosure Settlement provided many benefits for struggling homeowners, including $120 million for principal reduction and $36 million for refinancing programs for Connecticut borrowers who owe more than their homes are worth. The settlement, however, also eliminated the legal uncertainty for banks proceeding with foreclosures, which is causing foreclosures rates to increase this year. The settlement also required the five banks that are part of the agreement to follow new mortgage servicing standards, which will protect struggling homeowners and prevent future foreclosures.

      These mortgage servicing standards need to be extended to all homeowners, which is what Rosa's Regulation of Mortgage Serving Act would do. The legislation would protect all struggling homeowners by ensuring that eligible borrowers have access to loan modifications and other alternatives to foreclosure.
  - topic: "Protect Programs to Encourage Homeownership"
    value: "Supports preserving homeownership tax incentives (mortgage interest and property tax deductions) and opposes reducing homebuyer access to federally-guaranteed mortgages through the Federal Housing Administration."
    snippet: |
      Protect Programs to Encourage Homeownership
      Homeownership is not only critical to the formation of wealth for families, but also the foundation of safe and stable neighborhoods. Homeownership rates are currently at 15 year lows due to the housing and financial crises. Rosa believes we need to maintain existing incentives for homeowners and provide new ones to close the gap. Historically, the U.S. encouraged homeownership through tax incentives, including the mortgage interest deductionand property tax deduction. As Congress considers options to reform the tax code, Rosa believes these incentives to encourage homeownership need to be preserved.

      Since the Federal Housing Administration was created in 1934, Congress has encouraged stability and affordability in the housing market through federally guaranteed mortgages. Due to housing and financial crisis, over 90% of new home mortgages underwritten 2011 were guaranteed by the federal government because private lenders and banks were unwilling to lend. Congresswoman DeLauro opposes efforts to reduce homebuyer access to federally secured mortgages.
  - topic: "Connecticut Infrastructure Investment"
    value: "Secured over $100 million in federal transportation funding for Connecticut's Third District, including major funding for the Q Bridge project, an Intermodal center in Middletown, Route 34 widening in Derby, Route 8 corridor planning, and a West Haven commuter rail station."
    snippet: |
      Connecticut has some of the oldest infrastructure in the nation. You can see it every day on our roads, our schools and even in our water treatment plans. But our state not only requires better roads and mass transit, it also needs good-paying jobs. The good news is that for every billion dollars in new infrastructure investment, 47,500 new jobs are also created. That means a plan to solve massive traffic problems like Interstate 95 and the Q Bridge could bring thousands of needed jobs to the region.

      In the last surface transportation authorization measure, Congresswoman DeLauro secured more than $100 million in funds for Connecticut's Third District. Almost half of that money will go to the Q Bridge project, which is one of New England's largest ongoing highway construction projects. Some of this funding will go to numerous other important regional projects, including a new Intermodal center in Middletown, the widening of Route 34 in Derby, and planning for improvements to the Route 8 travel corridor. She also has secured more than $3 million in funds for the planned commuter rail station in West Haven.
  - topic: "National Infrastructure Development Bank Act"
    value: "Introduced legislation to establish a National Infrastructure Development Bank, modeled on the European Investment Bank, to leverage private-sector investment in transportation, environmental, energy, and telecommunications infrastructure projects; endorsed by a broad coalition including the U.S. Chamber of Commerce, the AFL-CIO's Building and Construction Trades Department, and the American Society of Civil Engineers."
    snippet: |
      According to the American Society of Civil Engineers, the current condition of the infrastructure in the United States earns a grade point average of D and an estimated $2.2 trillion investment is needed over the next 5 years to meet adequate conditions. Every $1 billion in federal funds invested in infrastructure creates or sustains approximately 47,500 jobs and $6.2 billion in economic activity. Investing in our nation's infrastructure-roads, bridges, highways, transit, housing, water systems, energy grids, broadband and so on-is therefore critical to moving our economy from recovery to long-term growth, keeping the United States competitive globally and improving our way of life.

      The National Infrastructure Development Bank Act would establish a National Infrastructure Development Bank, modeled after the European Investment Bank, which would leverage private sector dollars to invest in transportation, environmental, energy and telecommunications infrastructure projects. The Bank would objectively consider the economic, environmental, social benefits and costs of infrastructure projects, as well as other specific criteria, and fund projects of significance. The Bank would provide investment opportunities that would supplement current federal programs creating jobs, spurring economic growth and rebuilding an infrastructure system for the 21st century.

      The bank concept is endorsed by the American Council of Engineering Companies, American Society of Civil Engineers, Associated General Contractors of America, Building and Construction Trades Department (AFL-CIO), Building America's Future, Campaign for America's Future, Construction Management Association of America, National Construction Alliance II, National Governors Association, PolicyLink, Service Employees International Union, Third Way, Transportation for America and the U.S. Chamber of Commerce.
