# elaineforcongress.com sits behind a Cloudflare human-verification
# challenge, so the pipeline could never read it. The text below was read
# off the live site by a person and quoted verbatim, same quote-anchored
# rule llmExtract.ts enforces on an automated pass: every `value` is
# traceable to its own `snippet`, nothing inferred or summarized in from
# elsewhere on the page.
#
# Her page is written largely as a contrast with the current VA-2
# incumbent, Jen Kiggans. Only Luria's OWN stated positions and record are
# recorded here -- her characterizations of Kiggans' votes are campaign
# argument about an opponent, not a statement of Luria's platform, and
# this project does not publish one candidate's claims about another as
# though they were policy. Where a claim about Kiggans was inseparable
# from Luria's own position, the quote is trimmed to Luria's half.
platform_source_url: "https://elaineforcongress.com/"
platform:
  - topic: "Congressional Stock Trading"
    value: "Supports banning members of Congress and their families from trading individual stocks while holding office"
    snippet: "I support banning members of Congress and their families from trading individual stocks while holding office."
  - topic: "Prediction Market Insider Trading"
    value: "Would bar members of Congress, staff, executive branch employees and political appointees from using nonpublic information to trade prediction market contracts on political or policy outcomes"
    snippet: "Members of Congress, congressional staff, executive branch employees, and political appointees should not use nonpublic information to buy, sell, or exchange prediction market contracts related to political outcomes or government policy."
  - topic: "Penalties for Misusing Taxpayer Funds"
    value: "Believes members who steal taxpayer funds, including blatant tax evasion, should serve mandatory jail time and be expelled from Congress"
    snippet: "I believe that members who steal taxpayer funds, including blatant tax evasion, should serve mandatory jail time and be expelled from Congress. No questions asked."
  - topic: "Campaign Finance & Citizens United"
    value: "Supported legislation to overturn Citizens United and would continue to fight for the For the People Act"
    snippet: "I was proud to support legislation that overturns the disastrous Citizens United decision when in Congress, and I will continue to fight for the For the People Act to restore fairness and power back to the people."
  - topic: "Presidential Pardons"
    value: "Says politicians in both parties have abused the pardon system for family and well-connected donors, and would reform it so money and connections don't get special treatment"
    snippet: "Politicians from both parties have abused the pardon system to reward their families and wealthy and well-connected donors with political favors."
  - topic: "Cost of Living"
    value: "Frames rising costs for gas, groceries, prescriptions, housing and childcare as the central squeeze on Hampton Roads families"
    snippet: "From gas and grocery prices to prescription drug costs, housing, and childcare, the rising cost of living continue to squeeze Virginians."
  - topic: "Health Care & Prescription Drugs"
    value: "Would strengthen the ACA, reinstate ACA tax credits, expand access to care, cut prescription drug prices, and fund Medicaid and Medicare"
    snippet: "I will continue to build on the progress we made in Congress to strengthen the ACA, reinstate the ACA tax credits that helped lower costs for middle class families, expand access to health care, cut prescription drug prices, and ensure Medicaid and Medicare are properly funded."
  - topic: "Prescription Drug Record"
    value: "Voted to cut prescription drug costs, cap seniors' out-of-pocket expenses, and cap insulin at $35 a month for seniors"
    snippet: "I also proudly voted to stand up to Big Pharma and slash prescription drug costs, cap out of pocket expenses for seniors, and cap the price of insulin at $35 a month for seniors."
  - topic: "Tariffs & Energy Costs"
    value: "Would serve as a check on Trump's decisions, fight to repeal the tariffs, and reverse policies that have increased energy costs"
    snippet: "In Congress, I will serve as a check on Trump’s bad decisions that are costing our families, fight to repeal the tariffs, and reverse legislation and policy decisions that have increased energy costs."
  - topic: "Veterans"
    value: "Served on the House Veterans' Affairs Committee and was instrumental in passing the PACT Act, and passed the Gold Star Families Act for tax relief"
    snippet: "In Congress, I served on the House Veterans’ Affairs Committee and was instrumental in passing the PACT Act–the largest expansion of veterans’ benefits in our lifetime. I also introduced and passed the Gold Star Families Act to provide tax relief for Gold Star families and championed legislation to provide three cost of living increases to veterans."
  - topic: "Veterans Care Going Forward"
    value: "Would work to cut red tape in the VA system and ensure veterans get the care they need"
    snippet: "work to cut red tape in the VA system, and ensure that our veterans get the care they need and deserve."
  - topic: "National Security & Military Readiness"
    value: "Championed legislation providing a troop pay raise, investing in warfighters, strengthening naval seapower, and deterring Russia, China and Iran"
    snippet: "I used my experience in the Navy to champion legislation in Congress that provided troops with a pay raise, invested in our warfighters, strengthened naval seapower, and led efforts to deter our enemies like Russia, China, and Iran."
  - topic: "War in Iran"
    value: "Calls the war in Iran an unnecessary and endless military intervention that has left Americans no safer"
    snippet: "The war in Iran is another unnecessary and endless military intervention in the Middle East that is putting a strain on working families in Hampton Roads, and costing precious American lives and resources that should be spent here at home."
  - topic: "Immigration & Border Security"
    value: "Supported comprehensive efforts to deter illegal immigration and strengthen border security while providing a pathway to citizenship for those who follow the law"
    snippet: "I was proud to support comprehensive efforts in Congress to deter illegal immigration and strengthen border security, while also providing a pathway to citizenship for those who follow our nation’s laws."
  - topic: "Social Security & Medicare"
    value: "Would strengthen Medicare and Social Security and oppose cuts to those programs"
    snippet: "I will continue to advocate for strengthening Medicare and Social Security, stand firm against any efforts to gut seniors’ hard-earned benefits, and oppose cuts to these critical programs."
  - topic: "Abortion"
    value: "Voted to codify Roe v. Wade into law, protect the right to travel for abortion services, and ensure access to reproductive care without government interference"
    snippet: "In Congress, I voted to codify Roe v. Wade and enshrine the right to an abortion nationwide into law, protect the right to travel for abortion services, and ensure access to reproductive care without government interference."
  - topic: "Reproductive Care for Servicemembers"
    value: "Says that as a veteran she will fight to protect reproductive care for servicemembers"
    snippet: "As a veteran, I will also fight to protect reproductive care for our servicemembers."
  - topic: "Climate & Coastal Resilience"
    value: "Secured funding to mitigate sea-level rise, supported climate-resilient infrastructure, and founded the bipartisan Offshore Wind Caucus"
    snippet: "In Congress, I secured funding to mitigate the impacts of sea-level rise, supported legislation to invest in climate resilient infrastructure, and founded the bipartisan Offshore Wind Caucus."
  - topic: "Chesapeake Bay"
    value: "Led legislation to secure $85 billion and fully fund the EPA's Chesapeake Bay Program"
    snippet: "I have also been a strong advocate for the Chesapeake Bay and led legislation to secure $85 billion and fully fund the EPA’s Chesapeake Bay Program, and ensure a clean and healthy Bay for our communities, economy, and way of life."
  - topic: "Offshore Drilling"
    value: "Would fight against offshore drilling and work to restore the Chesapeake Bay and ensure clean air and water in Hampton Roads"
    snippet: "I will continue to lead efforts to combat climate change’s impact on our local community, fight against offshore drilling, restore the Chesapeake Bay, and ensure Hampton Roads has clean air and water."

# NO curated bio_summary on purpose. Her site's "Right the Ship" opening
# (Navy service, founding the Mermaid Factory) is real first-person copy
# and campaign_site outranks wikipedia in campaignBioSummary.ts's
# waterfall -- but the Wikipedia summary already resolved for her says she
# "served as the U.S. representative from Virginia's 2nd congressional
# district from 2019 to 2023", which is exactly the context a voter needs
# for a former member seeking her old seat back, and her own copy never
# mentions it. Overriding here would have followed source precedence while
# making the field less informative, so the resolved summary stands.
