# jamestalarico.com's root page loads fine (real title, not a Cloudflare
# interstitial), but a direct navigation to /priorities specifically
# failed for this browser tool, and the site otherwise appears to be a
# client-rendered single-page app -- consistent with why the pipeline's
# automated extraction needed a person to page through it by hand. The
# text below was read off the live "Priorities" page (five distinct
# issue sub-pages, each with its own URL under the same page) by a
# person and quoted verbatim, same quote-anchored rule llmExtract.ts
# enforces on an automated pass.
#
# Transcribed section by section; covered so far are the (untitled in
# what was pasted -- section header derived by me from content) "Money
# in Politics & Government Accountability" section, "Taxes & Cost of
# Living", "Public Education", "Health Care", and "Freedom, Family &
# Faith". Every section repeats a short run of empty, textless bullet
# markers between its narrative intro and its "My Priorities" list --
# a consistent site-wide rendering artifact (almost certainly an icon
# row), never containing any hidden text, and not reproduced below.
#
# Exclusions follow this file's standing rule against attributing
# opponent argument to the candidate as platform: the "Freedom, Family &
# Faith" section's opening paragraph and three bullets naming and
# attacking John Cornyn and Ken Paxton by name are excluded entirely.
# Generic "politics is corrupt" / "billionaires vs. the middle class"
# framing sentences with no self-attributed action, and closing
# campaign-rhetoric restatements of a point already captured earlier in
# the same section, are excluded the same way every other candidate file
# this project excludes them. The "— James Talarico —" line that
# recurs mid-page is the site's own pull-quote/byline formatting, not
# candidate text, and is not quoted as content anywhere below. The
# Governor Abbott voucher-fight and Elon Musk mentions in "Public
# Education" are kept despite naming people, since both sentences
# describe Talarico's OWN action/role, not an attack with no
# self-commitment -- same distinction already applied in this project to
# Menendez's Gateway Program entry. Several bullets are reused verbatim
# by the campaign across more than one issue page (the same insulin/drug-
# import and child-care-tax-exemption track-record lines appear on both
# "Taxes & Cost of Living" and "Health Care" or "Freedom, Family &
# Faith"); each is recorded once, under the section it was first
# transcribed from, not repeated.
platform_source_url: "https://jamestalarico.com/priorities"
platform:
  # "Money in Politics & Government Accountability"
  - topic: "Corporate PAC Money"
    value: "Says he's never taken a dime of corporate PAC money"
    snippet: "That’s why I’ve never taken a dime of corporate PAC money."
  - topic: "Texas Quorum Break Over Redistricting"
    value: "Broke quorum twice with Texas House colleagues to fight rigged redistricting maps and defend the freedom to vote"
    snippet: "It’s why I broke quorum twice with my colleagues in the Texas House to fight back against rigged redistricting maps and defend the freedom to vote."
  - topic: "Anti-Corruption Legislative Package"
    value: "Says the first legislation he will pursue in the U.S. Senate will be an anti-corruption package banning super PACs and corporate PACs, banning partisan gerrymandering, and increasing government transparency and accountability"
    snippet: "And it’s why the first set of legislation I will pursue in the U.S. Senate will be an anti-corruption package to ban super PACs and corporate PACs, ban partisan gerrymandering, and increase transparency and accountability in all branches of government."
  - topic: "Ban Super PACs & Corporate PACs"
    value: "Wants to reverse the impact of Citizens United by banning super PACs and corporate PACs"
    snippet: "Get Big Money out of our politics: Reverse the impact of the Supreme Court’s Citizens United ruling, including by banning super PACs and corporate PACs."
  - topic: "Ban Partisan Gerrymandering Nationwide"
    value: "Wants to establish independent redistricting commissions nationwide so voters choose their politicians rather than the other way around"
    snippet: "Ban partisan gerrymandering nationwide: Establish independent redistricting commissions so that voters can choose their politicians — not the other way around."
  - topic: "Voting Rights Act"
    value: "Wants to pass the John Lewis Voting Rights Advancement Act to remove unnecessary barriers to registering to vote and casting a ballot"
    snippet: "Make it easier for citizens to participate in our elections: Pass the John Lewis Voting Rights Advancement Act to remove unnecessary barriers to registering to vote and casting a ballot."
  - topic: "Ban Congressional Stock Trading"
    value: "Wants to ban members of Congress from trading individual stocks, engaging in insider trading, and profiting from their positions"
    snippet: "Ban Congressional stock trading: Ban Members of Congress from trading individual stocks, engaging in insider trading, and profiting from their positions."
  - topic: "Congressional Term Limits"
    value: "Wants term limits of six two-year terms in the House and two six-year terms in the Senate"
    snippet: "Institute term limits on Members of Congress: Implement term limits of six two-year terms in the House and two six-year terms in the Senate to bring new perspectives to Congress and prevent entrenched, career politicians who are not accountable to their constituents."
  - topic: "Mandatory Annual Town Halls"
    value: "Wants to require members of Congress to hold annual town halls in their district"
    snippet: "Require Members of Congress to hold annual town halls: Ensure officials are listening and responding to their constituents through yearly town halls in their district."
  - topic: "Ban Presidential Pardons"
    value: "Wants to eliminate the broad power of presidential pardons, which he says has been abused by presidents on both sides of the aisle"
    snippet: "Ban presidential pardons: Eliminate the broad power of presidential pardons that has been abused by presidents on both sides of the aisle."
  - topic: "Supreme Court Accountability"
    value: "Wants term limits and a binding code of conduct for Supreme Court justices, including recusal rules, financial disclosures, and gift limits"
    snippet: "Increase accountability for the Supreme Court: Implement term limits and a binding code of conduct for U.S. Supreme Court justices, including mandating rules for recusals, financial disclosures, and limitations on accepting gifts."
  - topic: "Government Ethics & Oversight"
    value: "Wants to defend against efforts to ignore court rulings or dismantle checks and balances, and to only confirm judicial appointees who meet the highest ethical standards and commit to upholding the Constitution"
    snippet: "Increase oversight and improve ethics at all levels of government: Defend against government efforts to ignore court rulings or dismantle checks and balances, and only confirm judicial appointees who meet the highest ethical standards and commit to upholding the Constitution."

  # "Taxes & Cost of Living"
  - topic: "Personal Story & Working-Class Motivation"
    value: "Cites growing up in East Austin raised by a single mother who worked overtime at a hotel, and his own experience as a public school teacher struggling with student and medical debt, as the reason he believes government should serve working people instead of giant corporations"
    snippet: "I was born to a single mom who worked overtime at a hotel to support me. We lived in a little apartment in East Austin. There wasn’t room for a nursery, so I slept in a crib in her closet. She was so proud of that closet. She decorated it with pictures and toys — no one was gonna tell her it wasn’t a nursery!\n\nAs a former public school teacher, I know what it’s like to work early mornings and late nights in an underpaid, stressful job. I know what it’s like to be crushed by student debt and medical debt. And I know what it’s like to feel like the system isn’t working for you.\nWe need a government that serves working people instead of giant corporations."
  - topic: "Legislative Record Summary"
    value: "Says that as a legislator he has fought for working Texans, stood up to billionaire mega-donors and special interests, and passed major legislation lowering the cost of prescription drugs, housing, and childcare"
    snippet: "As a legislator, I have fought for working Texans, I’ve stood up to billionaire mega-donors and special interests, and I’ve worked to cut bureaucratic red tape — passing major legislation to lower the cost of prescription drugs, housing, and childcare. Now I’m ready to take this fight to the U.S. Senate."
  - topic: "Fairer Tax System"
    value: "Wants a fairer tax system that makes giant corporations and the wealthiest Americans pay their fair share -- including higher taxes on billionaires' income and capital gains, ending 'buy, borrow, die' wealth-growth loopholes, raising the corporate tax rate, ending carried-interest loopholes, and taxing corporate stock buybacks -- so taxes can be cut for working families and small businesses"
    snippet: "Create a fairer tax system: Make giant corporations and the wealthiest Americans pay their fair share of taxes. (That way, we can cut taxes for working families and small businesses.) Make billionaires pay their fair share in taxes — including by imposing a higher tax on their income and capital gains and ending the dubious “buy, borrow, die” loopholes that billionaires use to grow untaxed wealth. Make corporations pay their fair share in taxes — including by raising the corporate tax rate (it has fallen by HALF since the mid-1980s!), ending the “carried interest” tax loopholes that allow hedge funds to avoid paying billions that they owe, and rolling back other extreme tax breaks that allow the largest corporations to pay $0 in federal income taxes. Raise the tax on corporate stock buybacks, which corporations use to artificially inflate their stock prices instead of making investments in research and development or to pay their employees the full value of their work."
  - topic: "Minimum Wage & CEO Pay Ratio Tax"
    value: "Wants to raise the federal minimum wage to $15/hour and create a special tax on corporations that pay top executives more than 250 times their median worker's salary"
    snippet: "Increase wages for workers, not CEOs: Raise the federal minimum wage to $15 an hour, and incentivize CEOs to pay fair wages by creating a special tax on corporations that pay their top executives more than 250 times their median worker’s salary."
  - topic: "Social Security & Retirement Security"
    value: "Wants to fight cuts to Medicare and Social Security, eliminate the Social Security tax cap for earnings over $400,000/year, and incentivize employer-sponsored pensions"
    snippet: "Ensure Americans can afford to retire: Fight tooth and nail against attacks on Medicare and Social Security, ensure the wealthiest Americans pay their fair share into Social Security by eliminating the tax cap on those earning over $400,000 a year, and incentivize employer-sponsored pensions."
  - topic: "Child Tax Credit & EITC Expansion"
    value: "Wants to expand the Child Tax Credit and Earned Income Tax Credit"
    snippet: "Expand tax credits that support working families: Expand the Child Tax Credit and the Earned Income Tax Credit, which reward hard work, offset the cost of raising children, and can save the government money over the long-term."
  - topic: "Health Care & Prescription Drug Costs"
    value: "Wants a federal public health insurance option, caps on out-of-pocket drug costs, reinstated ACA enhanced premium tax credits, more Medicare price-negotiating power, faster generic drug approvals, and regulation of pharmacy benefit managers"
    snippet: "Lower health care and prescription drug costs: Create a federal public health insurance option that competes with private insurance, institute caps on out-of-pocket costs for lifesaving drugs, reinstate the Affordable Care Act (ACA)’s enhanced premium tax credits, increase price transparency and Medicare’s negotiating power to ensure fair pricing, incentivize the development and approvals of generics, and regulate pharmacy benefit managers to ensure they’re not up-charging patients."
  - topic: "Housing Costs"
    value: "Wants to stop corporate landlords from manipulating rents, ban Wall Street from buying up housing stock, expand the Low-Income Housing Tax Credit, repeal red tape hindering construction, lower property insurance costs, and create a federal task force to speed modular home construction"
    snippet: "Lower housing costs: Stop corporate landlords from engaging in market manipulation to artificially hike rents, ban Wall Street from buying up housing stock to enrich wealthy investors while making it harder for families to afford homes, expand the Low-Income Housing Tax Credit, repeal outdated red tape that hinders the construction of housing, support legislation to lower property insurance costs, and create a federal task force charged with helping communities use quality, cost-effective options like factory-built “modular” homes to speed up construction timelines."
  - topic: "Grocery Costs"
    value: "Wants to defend SNAP and WIC, increase oversight of mergers that inflate prices, remove tariffs on produce that can't be grown domestically, and reduce barriers for new grocery providers"
    snippet: "Lower grocery costs: Stand up to attacks against SNAP and WIC, increase oversight into mergers and acquisitions that artificially jack up prices, remove tariffs on produce that can’t be grown in the United States, and reduce barriers to entry for new grocery providers to increase market competition."
  - topic: "Energy Costs"
    value: "Wants AI data centers to pay for their own energy infrastructure upgrades, wants to diversify energy sources, expand the Energy Star program, and modernize LIHEAP's funding formula so hot-climate states like Texas get equitable utility assistance"
    snippet: "Lower energy costs: Require AI data centers to pay for their own energy infrastructure updates so those costs aren’t passed on to consumers, diversify our energy sources to drive down costs, expand the Energy Star program that educates consumers about energy-efficient products, and modernize the Low-Income Home Energy Assistance Program’s disbursement formula to ensure that hot climate states — like Texas — receive equitable funds to help families with utility costs."
  - topic: "Repeal Trump Tariffs"
    value: "Wants to repeal the Trump tariffs that he says are making groceries, cars, and clothing more expensive"
    snippet: "Repeal the Trump tariffs: Repeal the Trump tariffs that are making everything — from groceries to cars to clothing — more expensive."
  - topic: "Prescription Drug Cost Record"
    value: "Says he reduced prescription drug costs in Texas by capping insulin co-pays at $25/month, allowing prescription drug imports from Canada, increasing pricing transparency, and establishing a drug savings program for the uninsured"
    snippet: "Reduced prescription drug costs by capping insulin co-pays at $25 a month in Texas, allowing Texas to import cheaper prescription drugs from Canada at reduced costs, increasing transparency around Big Pharma’s price gouging tactics, and establishing a prescription drug savings program for uninsured Texans."
  - topic: "Housing Cost Record"
    value: "Says he lowered housing costs in Texas by replacing outdated regulations to increase apartment/condo supply, establishing Texas' first Low-Income Housing Tax Credit program, and providing tax relief for low-income housing construction"
    snippet: "Lowered housing costs by replacing outdated regulations to increase the supply of apartments and condos, establishing Texas’ first-ever Low-Income Housing Tax Credit program, and providing tax relief on low-income housing construction."
  - topic: "Child Care Cost Record"
    value: "Says he lowered child care costs in Texas by establishing property tax exemptions for child care providers and increasing the supply of high-quality centers"
    snippet: "Lowered child care costs by establishing property tax exemptions for child care providers and increasing the supply of high-quality centers."
  - topic: "Property Tax Record"
    value: "Says he lowered property taxes by voting to increase the school district homestead tax exemption and business personal property tax exemption, and providing additional exemptions for elderly and disabled homeowners"
    snippet: "Lowered property taxes by voting to increase the school district residence homestead tax exemption, increase the business personal property tax exemption, and provide additional exemptions for elderly and disabled homeowners."
  - topic: "Higher Education Cost Record"
    value: "Says he lowered higher education costs by establishing tuition and fee exemptions and a public junior college state finance program"
    snippet: "Lowered higher education costs by establishing tuition and fee exemptions and a public junior college state finance program."

  # "Public Education"
  - topic: "Teaching Background"
    value: "Taught 6th-grade language arts on the Westside of San Antonio, one of Texas's poorest zip codes, before running for office, and says he had 45 kids in one classroom (some sitting on the air conditioning unit) after the Legislature cut $5 billion from public education"
    snippet: "Before I ran for office, I was a public school teacher. I taught 6th-grade language arts on the Westside of San Antonio — one of Texas’s poorest zip codes.\n\nWhen I entered the classroom, the Texas Legislature had just gutted the public education budget by $5 billion — so I had 45 kids in one classroom. There weren’t enough desks for everyone, so some of my students sat on the air conditioning unit."
  - topic: "Public Education Committee"
    value: "Says his classroom experience drove him to run for office, and in each of his four terms in the Texas House he served on the Public Education Committee working to increase teacher pay, improve early childhood education, and expand career and technical education"
    snippet: "My experience in the classroom is what drove me to run for public office. In each of my four terms in the Texas House of Representatives, I served on the Public Education Committee — partnering with parents, teachers, and students to increase teacher pay, improve early childhood education, expand career and technical education, and more."
  - topic: "Opposition to School Vouchers"
    value: "Was selected by Texas House colleagues to lead the fight against Governor Abbott's private school voucher program, which he says takes tax dollars from public schools to subsidize private education even for billionaires, and says he has gone up against billionaire donors including Tim Dunn, Farris Wilks, and Betsy DeVos who fund attacks on public schools"
    snippet: "Because of that commitment to public schools, my colleagues in the Texas House selected me to lead the fight against Governor Abbott’s private school voucher scam — a program that is taking tax dollars out of our public schools to subsidize private education, even for billionaires like Elon Musk. I’ve gone toe-to-toe with billionaires like Tim Dunn, Farris Wilks, and Betsy DeVos, who have been spending their fortunes attacking our neighborhood public schools."
  - topic: "Reading & Math Achievement"
    value: "Wants to provide grants and incentives for public schools to adopt evidence-based strategies like phonics, early literacy programs, and 1:1 intensive tutoring"
    snippet: "Boost reading and math achievement: Provide grants and other incentives to encourage public schools to adopt evidence-based strategies like phonics, early literacy programs, and 1:1 intensive tutoring."
  - topic: "Teacher Recruitment & Training"
    value: "Wants to expand programs like the Teacher Quality Partnership, the Supporting Effective Educator Development program, and the TEACH grant to fund teacher training and close the teacher workforce gap"
    snippet: "Hire more teachers and equip them with what they need to succeed: Expand programs like the Teacher Quality Partnership, the Supporting Effective Educator Development program, and the TEACH grant that fund and enhance teacher training and are helping to close the teacher workforce gap."
  - topic: "Oppose Private School Vouchers Nationally"
    value: "Wants to reject voucher programs pushed by billionaire mega-donors that he says defund public schools to subsidize private education for the wealthy"
    snippet: "Stand up to Big Money and fight private school voucher scams: Reject the voucher scams being pushed by billionaire mega-donors that defund public schools to subsidize private education for the wealthiest Americans."
  - topic: "Universal Pre-K & Childcare"
    value: "Wants universal Pre-K for every 3- and 4-year-old, strong investment in childcare for children under 3, and protection for Head Start"
    snippet: "Secure universal early childhood education and affordable childcare: Establish universal Pre-K for every 3- and 4-year-old, make strong investments in childcare for children under 3, and protect Head Start."
  - topic: "Special Education Funding"
    value: "Wants to protect federal oversight ensuring special education students get the funding and support they need"
    snippet: "Support special education students: Protect federal oversight that ensures special education students receive the funding and support they need to be successful."
  - topic: "Career & Technical Education"
    value: "Wants to start students on flexible career paths in middle and high school by improving junior college and Career and Technical Education programs"
    snippet: "Set students on career paths: Start students on flexible career paths in middle and high school by improving junior college and Career and Technical Education programs."
  - topic: "School Meals & Student Mental Health"
    value: "Wants to expand the National School Lunch and School Breakfast programs and add more school counselors for student mental health support"
    snippet: "Prioritize student health so kids can learn in the classroom: Expand the National School Lunch and School Breakfast programs (because no student can learn on an empty stomach!) and add more counselors to ensure kids have the mental health resources and other support they need in school."
  - topic: "AI in the Classroom"
    value: "Wants to establish guidelines to help states and schools safely use AI in the classroom to enhance rather than hinder learning"
    snippet: "Ensure AI is a benefit, not a harm, in the classroom: Establish recommended guidelines that can help states and schools safely use AI in the classroom in ways that enhance — rather than hinder — learning opportunities and educational outcomes."
  - topic: "School Finance Overhaul"
    value: "Says he overhauled Texas's school finance system and invested over $6.5 billion into public schools for teacher pay raises, educator training, and literacy/math proficiency initiatives"
    snippet: "Overhauled Texas’s school finance system and invested over $6.5 billion into public schools for teacher pay raises, educator training, new literacy and math proficiency initiatives, and more."
  - topic: "Led Fight Against Vouchers"
    value: "Says he led the fight against private school vouchers defunding Texas's neighborhood public schools"
    snippet: "Led the fight against private school vouchers that are defunding Texas’ neighborhood public schools."
  - topic: "Early Childhood Education Access"
    value: "Says he increased access to early childhood education by expanding Pre-K partnerships with child care providers and lowering costs through property tax relief for child care centers"
    snippet: "Increased access to early childhood education by expanding Pre-K partnerships with quality child care providers and lowering costs by providing property tax relief for child care centers."
  - topic: "Pre-K Class Size Cap"
    value: "Says he passed the first-ever cap on Pre-K class sizes to reduce student-to-teacher ratios"
    snippet: "Passed the first-ever cap on Pre-K class sizes to reduce student-to-teacher ratios and give our youngest students more individualized attention."
  - topic: "School Mental Health Resources"
    value: "Says he prioritized mental health in schools by opening up millions of dollars in mental health resources for students and improving educator training on mental health and substance abuse"
    snippet: "Prioritized mental health in schools by opening up millions of dollars in mental health resources for students and improving trainings for educators on mental health and substance abuse."
  - topic: "Narcan in Schools"
    value: "Says he equipped every public school with Narcan to fight the teen overdose crisis"
    snippet: "Equipped every public school with Narcan to fight the teen overdose crisis."
  - topic: "School Safety Training"
    value: "Says he improved school safety by increasing access to active shooter and other safety trainings"
    snippet: "Improved school safety in Texas by increasing child care providers’ access to active shooter and other safety trainings."
  - topic: "Retired Teacher Pension '13th Check'"
    value: "Says he supported retired teachers by voting for a '13th check' supplemental payment on top of retirement benefits"
    snippet: "Supported retired teachers by voting to provide a “13th check” — a supplemental payment on top of their retirement benefits."

  # "Health Care"
  - topic: "Type 1 Diabetes Diagnosis & Insulin Costs"
    value: "Was diagnosed with type 1 diabetes at 28 after collapsing during a 25-mile campaign walk across his House district, and says his first 30-day insulin supply cost $684 -- despite it costing companies only about $10 per vial to produce -- which he had to put on a credit card"
    snippet: "When I was 28 years old, I almost died.\n\nI was running in my first race for the Texas House. I decided to walk the entire length of my district — 25 miles in one day — holding town halls along the way. I wasn’t worried about my ability to finish the walk — I hike Big Bend every year!\n\nBut about halfway through, I started feeling nauseous and fatigued. I threw up a couple of times on the way, but figured I was just dehydrated. Somehow, I finished.\n\nWhen I got home, I slept for 36 hours. My family rushed me to the ER, where nurses checked my blood sugar. I was immediately diagnosed with type 1 diabetes. I was in diabetic ketoacidosis, which ends in coma and death without insulin.\n\nWhen I got out of the ICU, I went to Walgreens to pick up my first 30-day supply of insulin. It cost me $684. I didn’t have that kind of money (most Texans don’t, either) — so I put it on a credit card. I later learned that it costs companies only $10 per vial to produce insulin, but Big Pharma boosts profits by price gouging."
  - topic: "Medicare for All Ages (Public Option)"
    value: "Wants to let every American, regardless of age, join Medicare as an affordable not-for-profit health option, increasing competition to bring down costs for those who don't participate"
    snippet: "Allow every American — regardless of their age — to join Medicare: Provide an affordable not-for-profit health care option for every American, while also bringing down costs for those who don’t participate by increasing competition with private insurance."
  - topic: "Prescription Drug Costs (Senate Priority)"
    value: "Wants to increase drug price transparency and negotiating power, speed generic drug approval, cap out-of-pocket costs, and regulate pharmacy benefit managers"
    snippet: "Lower prescription drug costs: Increase price transparency and negotiating power to ensure fair pricing, incentivize the development and approval of generic drugs, institute caps on out-of-pocket costs, and regulate pharmacy benefit managers to ensure they’re not up-charging patients."
  - topic: "Protect ACA Coverage & Premiums"
    value: "Wants to protect and improve the ACA and reverse cuts to ACA enhanced tax credits, Medicare, and Medicaid that he says will kick 15 million Americans off insurance and raise premiums for millions more"
    snippet: "Protect health coverage and lower premiums: Protect and improve the Affordable Care Act (ACA) and reverse the Trump Administration’s dangerous cuts to the ACA enhanced tax credits, Medicare, and Medicaid that will kick 15 million Americans off their insurance and raise premiums for millions more."
  - topic: "Prior Authorization Reform"
    value: "Wants to stop insurance companies from arbitrarily denying medication and treatment that a patient's health care provider has determined necessary"
    snippet: "Reform the prior authorization system: Ensure that insurance companies do not arbitrarily deny patients the medication and treatments that their health care providers have determined necessary."
  - topic: "Reproductive Health Care in Texas"
    value: "Wants to codify Roe v. Wade and protect access to contraception and IVF, saying women are dying needlessly under Texas's abortion ban"
    snippet: "Restore access to reproductive health care in Texas: Codify Roe v. Wade and protect access to contraception and IVF so that families can get the reproductive care they need and so that women are no longer dying needlessly due to Texas’ dangerous abortion ban."
  - topic: "Rural Hospitals"
    value: "Wants to prioritize recruiting and retaining rural health care workers, improve Medicaid/Medicare reimbursement rates, and fund rural hospitals"
    snippet: "Save rural hospitals: Prioritize recruiting and retaining rural health care workers,  improve Medicaid and Medicare reimbursement rates to more swiftly deliver payments to hospitals, and make sure rural hospitals have the funding they need to continue to serve as vital employers and health care providers."
  - topic: "Medical Debt Protections"
    value: "Wants to regulate medical debt collection, bar medical debt from credit scores, and increase billing/financial-assistance transparency"
    snippet: "Protect Americans from crippling medical debt: Regulate medical debt collection practices, bar the inclusion of medical debt in credit scores, and increase transparency and public reporting of both medical billing practices and the allocation of financial assistance provided by hospitals."
  - topic: "Veterans' Health Care (VA)"
    value: "Wants to stand against VA privatization and fully fund the agency so every veteran gets quality care"
    snippet: "Ensure veterans have access to the services they’ve earned: Stand against efforts to privatize the VA, and fund the agency to ensure every veteran receives the quality care they need."
  - topic: "Surprise Billing & Hospital Steering"
    value: "Says he held health insurers accountable by cracking down on surprise billing for emergency care and banning insurers from steering patients to hospitals that overcharge"
    snippet: "Held health insurance companies accountable by cracking down on surprise billings for emergency care and banning insurance companies from steering patients to hospitals that overcharge for services."
  - topic: "Health Insurance Premium Competition"
    value: "Says he brought down health insurance premiums by regulating anticompetitive consolidation practices that inflate prices"
    snippet: "Brought down health insurance premiums by regulating anticompetitive consolidation practices that health care and insurance companies use to inflate prices."
  - topic: "Rural Hospital Finance Office"
    value: "Says he protected rural hospitals by approving the State Office of Rural Hospital Finance and the Texas Rural Hospital Officers Academy"
    snippet: "Protected rural hospitals by approving the establishment of the State Office of Rural Hospital Finance and the Texas Rural Hospital Officers Academy."
  - topic: "EMS Worker Shortage"
    value: "Says he combated the health care worker shortage by offering tuition and fee exemptions for emergency medical students"
    snippet: "Combatted the health care worker shortage by offering tuition and fee exemptions for emergency medical students."
  - topic: "Medical Marijuana Access"
    value: "Says he increased access to medical marijuana for adults by expanding patient eligibility and establishing a compassionate use review board"
    snippet: "Increased access to medical marijuana for adults by expanding patient eligibility and establishing a compassionate use review board."
  - topic: "Medicaid Protection via Point of Order"
    value: "Says he used a procedural point of order on the Texas House floor to kill legislation that would have kicked thousands of Texans off Medicaid"
    snippet: "Protected Medicaid access for thousands of Texans by using a procedural point of order on the floor of the Texas house to kill legislation that would have kicked people off their coverage."
  - topic: "Veterans' PTSD Research"
    value: "Says he supported veterans' mental health by directing Texas agencies to research alternative therapies for PTSD"
    snippet: "Supported veterans’ mental health by directing Texas agencies to research alternative therapies for post-traumatic stress disorder."

  # "Freedom, Family & Faith"
  - topic: "Faith & Rejection of Christian Nationalism"
    value: "Is a Presbyterian seminarian studying to become a pastor, says his faith in Jesus leads him to reject Christian Nationalism, and believes in a pluralistic democracy where every person can be free regardless of religion, race, gender, or sexual orientation"
    snippet: "I’m a Presbyterian seminarian studying to become a pastor. My faith in Jesus leads me to reject Christian Nationalism and commit myself to the project of democracy. Because that’s the promise of America: a democracy where every person and every family — regardless of religion, race, gender, sexual orientation, or any other difference between us — can truly be free and live up to their full potential."
  - topic: "Free Speech & Anti-Censorship"
    value: "Wants to oppose book banning and cancel culture, pass the No Political Enemies Act protecting people from government retaliation for their speech, and defend freedom of the press"
    snippet: "Oppose censorship and protect the freedom of speech: Oppose book banning and cancel culture, pass the No Political Enemies Act to protect individuals and organizations from being targeted by the government for exercising their freedom of speech, and defend the freedom of the press."
  - topic: "Reproductive Freedom, LGBTQ+ Rights & Marijuana Legalization"
    value: "Wants to codify Roe v. Wade and protect contraception/IVF access, protect the legality of gay marriage and defend LGBTQ+ people from government overreach, and legalize regulated marijuana for adults"
    snippet: "Get government out of Americans’ private personal decisions: Restore reproductive freedom with federal legislation to codify Roe v. Wade and protect access to contraception and IVF, protect the legality of gay marriage and defend our LGBTQ+ neighbors from government overreach, and legalize regulated marijuana for adults so that we no longer put people behind bars for a substance that is already legal in half the country."
  - topic: "Paid Family Leave & Child Care"
    value: "Wants to expand the Child Tax Credit, pass paid family leave legislation, and expand access to affordable child care"
    snippet: "Make it easier to start and raise a family: Expand the Child Tax Credit to help families with the cost of raising children, pass paid family leave legislation that would allow Americans to take time off work to bond with a new child or care for a seriously ill family member, and expand access to affordable child care so that no parent has to choose between continuing their career and starting a family."
  - topic: "Eldercare Access"
    value: "Wants to pass the Older Americans Act Reauthorization Act to expand affordable home- and community-based senior care and build up the elder care workforce"
    snippet: "Make it easier for families to care for their aging loved ones: Increase access to eldercare by passing the Older Americans Act Reauthorization Act to expand affordable home- and community-based care for seniors, and prioritize the development of a high-quality elder care workforce."
  - topic: "Separation of Church and State"
    value: "Wants to pass the Do No Harm Act to protect religious liberty, act against antisemitism/Islamophobia/faith-based hate crimes, and reject forcing religion into neutral public spaces like schools, prisons, courts, and the military"
    snippet: "Defend the separation of church and state and continue to speak out against those who twist the meaning of faith to hurt our neighbors: Pass the Do No Harm Act to protect religious liberty and prevent religious discrimination; take vigorous action against antisemitism, Islamophobia, and other faith-based hate crimes; and reject policies that force religion into neutral public spaces like schools, prisons, courts, and the military."
  - topic: "Blocked Statewide Book Ban"
    value: "Says he killed legislation that would have established a statewide book ban and removed classic literature like Lonesome Dove and The Catcher in the Rye from public schools, using a procedural point of order"
    snippet: "Killed legislation that would have established a statewide book ban and removed classic literature like Lonesome Dove and The Catcher in the Rye in public schools by using a procedural point of order on the floor of the Texas House."
  - topic: "Opposed THC Ban"
    value: "Says he stood up to a proposed THC ban in Texas, arguing it would infringe on individual liberty, hurt veterans, and empower cartels"
    snippet: "Stood up to Texas Republicans’ proposed THC ban, calling out how it would infringe on individual liberty, hurt veterans, and empower the cartels."
  - topic: "Paid Family Leave Framework"
    value: "Says he made progress toward universal paid family leave in Texas by establishing a regulatory framework for employer-issued family leave insurance policies"
    snippet: "Made progress toward universal paid family leave in Texas by establishing a regulatory framework for family leave insurance policies issued by employers."
  - topic: "Student-Parent Support Liaisons"
    value: "Says he supported young families by providing a liaison officer at each higher-education campus to connect student-parents with health care, employment, transportation, and academic support services"
    snippet: "Supported young families by providing a liaison officer at each campus of higher education to connect student-parents with health care, employment, transportation, and academic success services."
  - topic: "Marijuana Legalization Author"
    value: "Says he authored legislation to legalize regulated marijuana for adults in Texas and use the resulting tax revenue to fund child care and early childhood education"
    snippet: "Authored legislation to legalize regulated marijuana for adults in Texas and use the new tax revenue to fund child care and early childhood education."
  - topic: "Blocked Religion in Public Schools"
    value: "Says he defended the separation of church and state by leading the fight against legislation to put the Ten Commandments in public school classrooms, replace school counselors with untrained religious chaplains, and add Bible stories to public school curriculum"
    snippet: "Defended the separation of church and state by leading the fight against legislation to force the Ten Commandments into public school classrooms, replace school counselors with untrained religious chaplains, and infuse Bible stories into public school curriculum."
