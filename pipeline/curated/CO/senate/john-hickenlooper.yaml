platform:
  - topic: "Health Care"
    value: "Expanded health care to over 500,000 Coloradans as governor; as senator, has lowered drug prices for seniors and held pharmaceutical companies accountable for price gouging; supports a public option and Medicare drug-price negotiation; voted against a Trump-backed budget he says would double or eliminate health care costs for millions to fund $4 trillion in corporate tax cuts; working to restore Medicaid, ACA subsidy, and SNAP funding."
    snippet: |
      John knows health care is a right not a privilege. That's what has guided his work to deliver universal health care. As governor, he expanded health care to more than 500,000 Coloradans. As senator, he lowered drug prices for seniors and held pharmaceutical companies accountable for price gouging. John supports legislation to create a public option, lower drug prices by empowering Medicare to negotiate all drug prices, and improve health care access for rural, low-income, and minority communities.

      Now, he's fighting the Trump administration's assault on Americans' health care. He voted against their cruel budget that'll DOUBLE the cost of health care – or erase it entirely – for millions of people to give $4 trillion in tax cuts for large corporations and the ultra-wealthy. He's working to restore funding for Medicaid, ACA subsidies, and SNAP and introduced legislation to create real transparency in health care costs to protect people from hidden prices and root out corruption and waste.
  - topic: "Climate Change"
    value: "Fighting to combat climate change"
    snippet: "fighting to combat climate change"
  - topic: "Fighting Trump's Corruption"
    value: "Champions legislation to prevent Trump administration officials from using insider information to profit from military operations and to stop lawmakers from using their position for personal enrichment."
    snippet: |
      John knows this is the most corrupt administration in history. That's why he's fighting to stop them from profiting at the expense of the American people and rigging elections to hide from voters. John is rooting out corruption in Washington. He has championed legislation to prevent Trump and his cronies from using insider information to make millions betting on military operations and stop lawmakers from using their position to enrich themselves.
  - topic: "Protect Democracy, Ban Corporate PACs"
    value: "Refuses corporate PAC money; supports overturning Citizens United and sponsors legislation for stricter money-in-politics disclosure; as governor, helped establish universal vote-by-mail in Colorado; as senator, opposes efforts to suppress voting, end vote-by-mail, or deploy ICE agents to polling places."
    snippet: |
      John doesn't take a dime of corporate PAC money. He is fighting to ban dark money and special interest corruption in politics. He supports overturning the Citizens United ruling, which unleashed floods of dark money in politics, and is a sponsor of legislation to create stricter regulations and disclosures for money in politics. As governor, John helped create the gold-standard for universal vote-by-mail to expand voting access. As senator, he is fighting back against Trump's efforts to suppress the vote, end vote by mail, and deploy ICE agents to polling places.
  - topic: "Defending You from Trump's Illegal Tariff-taxes"
    value: "Opposes Trump's tariffs, calling them illegal taxes and demanding repayment; sits on the Senate Committee on Small Business and Entrepreneurship, championing legislation to expand capital access for small businesses, women, Coloradans of color, and rural communities."
    snippet: |
      As a former brewpub owner, John knows how hard it is to run a business. That's why he's standing up to Trump and demanding the president pay back every cent he stole with his illegal tariff-taxes. John sits on the Senate Committee on Small Business and Entrepreneurship and has championed legislation to expand access to capital for small businesses, women, Coloradans of color and rural communities.
  - topic: "Investing in American Workers"
    value: "Co-sponsors the PRO Act to strengthen workers' rights and collective bargaining; has joined picket lines across Colorado; opposed Trump-administration efforts to revoke federal employees' collective bargaining rights; as governor, helped create the CareerWise apprenticeship program; has authored AI workforce-protection legislation and supports regulating the AI industry; has fought Trump administration policies he says are raising grocery and medical costs."
    snippet: |
      John is a strong supporter of labor unions and American workers. He's joined picket lines across Colorado and supported workers as they organize for fair wages and better working conditions. In the Senate, he co-sponsors the PRO Act to strengthen workers' rights and help working Americans negotiate better salaries, benefits, and working conditions. He has stood up to Trump's efforts to revoke the rights of federal employees to collectively bargain. As governor, he helped create CareerWise and invest in apprenticeship programs for our next generation of workers and continues that work in the Senate.

      Artificial Intelligence is already shaping our lives and the economy. John knows our workers can't be left behind. That's why he's authored legislation to prepare and protect our workforce as we harness American innovation to lead on AI. He has worked to protect small businesses and consumers from cyberattacks and scams and supports regulating the artificial intelligence industry. He has fought back against the Trump Administration's policies that are skyrocketing costs for groceries, medical care and other everyday goods and has been working to reinstate employees that ensure consumers' rights.
  - topic: "Lowering Prices"
    value: "Turned Colorado into the #1 state economy for job creation as governor (per U.S. News & World Report); helped pass major federal housing, infrastructure, and clean energy legislation; works to lower housing costs by limiting large corporate ownership of the housing market and cutting building red tape."
    snippet: |
      Too many Coloradans are holding down two or three jobs but still can't get ahead. We need to build an economy that works for everyone, not just the ultra-wealthy and well-connected. More affordable housing, lower prices, good paying jobs, fair working conditions, and strong small businesses. That's the Colorado John is focused on building.

      As governor, John turned Colorado's economy around, from 40th in job creation, to the #1 economy in the country three years in a row, according to U.S. News & World Report. He took that experience to the Senate to craft the most comprehensive housing bill in decades, the greatest revamp of our infrastructure since the New Deal, and the largest investment to fight climate change and build a clean energy economy in history. He's helped secure federal funding to build more affordable housing, fix our bridges and roads, and invest in clean energy tech, creating tens of thousands of good-paying jobs in the process. John is helping lower the cost of housing by preventing large corporations from dominating the housing market, cutting red tape that slows building more homes, and supporting local communities to invest in the housing they need.
  - topic: "Defending Colorado from ICE's Violence"
    value: "Voted against increased ICE funding and introduced legislation banning ICE agents from wearing masks and conducting raids at sensitive locations (schools, hospitals, polling places, places of worship); has demanded answers regarding intimidation tactics against people of color, conducted oversight visits at ICE facilities, and helped secure the release of detained Coloradans."
    snippet: |
      John is committed to keeping our communities safe and holding law enforcement accountable.

      ICE is out of control. They've shot, beaten, and killed people. They're attacking constitutional rights. John refuses to accept their lawlessness. He knows they need to be completely overhauled or shut down. That's why he voted against giving ICE a penny more and introduced legislation to ban ICE agents from wearing masks and conducting raids at sensitive locations like schools, hospitals, polling places, and places of worship. He's demanded answers for the racist "death cards" left to intimidate people of color, conducted oversight visits at ICE facilities, and helped secure the release of Coloradans detained by ICE. John won't stop protecting Colorado from Trump's cruel mass deportation effort.
  - topic: "Ending Gun Violence"
    value: "As governor, passed sweeping gun safety reform including universal background checks and high-capacity magazine limits; in the Senate, helped pass the Bipartisan Safer Communities Act and helped form the Gun Violence Prevention Caucus; supports expanding background checks to all gun sales, banning assault weapons, and safe firearm storage regulation."
    snippet: |
      John knows gun violence is an epidemic we can solve. As Governor, he took on the NRA and won. He created sweeping gun safety reform including universal background checks and limits on high capacity magazines. In the Senate, he helped pass the first major gun legislation in decades, the Bipartisan Safer Communities Act, and helped form the Gun Violence Prevention Caucus. John supports legislation to expand background checks to all gun sales, ban assault weapons, and better regulate the safe home storage of firearms.
  - topic: "Safeguarding American Science"
    value: "Blocked a government funding package to help protect NCAR (National Center for Atmospheric Research) in Boulder from Trump-administration cuts threatening 800 jobs; voted against nominees he says undermine science; helped remove a public lands sale provision from the \"Big Bad Betrayal Act\"; has worked to secure clean water access for 50,000 Coloradans."
    snippet: |
      As the only peer-reviewed scientist in the Senate, John refuses to bend the knee to the Trump administration's all-out attack on science and American innovation. After the Trump administration attempted to dismantle the National Center for Atmospheric Research (NCAR) in Boulder, risking 800 jobs and undermining the weather science that saves lives, John didn't back down. He blocked a government funding package, joined rallies with Coloradans fighting back, and is working to protect NCAR's funding. He's continuing to push back on the administration's blatant attacks on proven science and voted against Trump's nominees who spread lies and undermine science.

      In the Senate, he continues to stand up to Trump's attacks on our lands and climate. He successfully helped to remove the public lands sale from the Republicans disastrous Big Bad Betrayal Act and has been standing up to Trump's efforts to punish Colorado, working to secure clean water for 50,000 Coloradans and protecting funding for NCAR to keep Americans safe during weather disasters.
  - topic: "Saving our Public Lands & Environment"
    value: "Helped build the coalition that stopped a Trump/MAGA plan to sell off millions of acres of public lands to fund tax cuts; helped secure the 2022 climate investment package and billions in wildfire/drought/clean-energy job funding for Colorado; created the Senate Colorado River Caucus securing billions for the Colorado River crisis; as governor, protected 100,000 acres of Colorado public lands and created national methane-regulation standards."
    snippet: |
      John knows our public lands will NEVER be for sale. When Trump and MAGA Republicans tried to sell off millions of acres of our public lands, John stopped them in their tracks. He helped build the coalition that mobilized millions of people across the country who put so much pressure on Republicans that they dropped their last-ditch plans to sell public lands to pay for tax cuts for the ultra-wealthy.

      His fight for our public lands and climate doesn't stop there. In 2022, John saved the largest climate investment EVER and helped secure billions for Colorado to fight climate change, protect communities from wildfire and extreme drought, and create tens of thousands of good-paying jobs. He won't stop fighting the Trump admin's attempts to roll back all that progress. He also created the Senate Colorado River Caucus and secured billions in federal funding to help address the Colorado river crisis. As governor, John successfully protected 100,000 acres of Colorado public lands from the Trump administration and created the country's gold standard for methane regulations.
  - topic: "Standing Up for Abortion Rights"
    value: "Supports restoring Roe v. Wade protections and reversing Medicaid cuts targeting Planned Parenthood; working to protect access to mifepristone and medical abortion and establish a nationwide right to IVF; as governor, expanded free birth control access."
    snippet: |
      Amid the Trump admin's relentless attacks on women's rights, John is defending a woman's right to choose. He is fighting to restore Roe v Wade and reverse disastrous Medicaid cuts that targeted Planned Parenthood. He is working to protect mifepristone and medical abortions and establish a nationwide right to access IVF. As governor, he expanded access to free birth control.
