# schwartzforcongress.com sits behind a Cloudflare human-verification
# challenge, so the pipeline could never read it. The text below was read
# off the live site by a person and quoted verbatim, same quote-anchored
# rule llmExtract.ts enforces on an automated pass: every `value` is
# traceable to its own `snippet`, nothing inferred.
#
# His page is written throughout as a contrast with the MD-1 incumbent,
# Rep. Andy Harris -- most sections open by naming him. Those passages are
# campaign argument about an opponent, not Schwartz's own platform, and
# are not recorded here; same treatment given Luria's material on Kiggans
# and Pulido's on De La Cruz. Where a proposal was stated only as a
# reversal of something attributed to Harris, the quote is trimmed to the
# action Schwartz would take.
#
# Covers all five policy sections: "The first district comes first",
# "Tackle the affordability crisis", "Protect individual freedoms", "Hold
# corrupt public officials and corporations accountable", and "Keep
# consumers safe". Each section lists three key examples plus a set of
# other priorities; the most substantive of both are recorded.
platform_source_url: "https://schwartzforcongress.com/"
platform:
  # "The first district comes first"
  - topic: "Constituent Access"
    value: "Promises to hold monthly town hall meetings across the district"
    snippet: "I promise to hold monthly town hall meetings across the district so I can better respond to the needs of our citizens."
  - topic: "Tariffs"
    value: "Would end tariffs affecting farmers, small businesses and families, saying repeal would save American families $5,000 a year"
    snippet: "Repealing unnecessary tariffs will save American families $5000 a year."
  - topic: "District Project Funding"
    value: "Would restore withheld funding for district projects, citing $36M for flooding remediation in Crisfield"
    snippet: "Restore funding for district projects that Rep. Harris supported illegally withholding (like $36M for flooding remediation in Crisfield which saves $6 for every $1 invested)."
  - topic: "Rural Health Workforce"
    value: "Would incentivize health care providers to work and live in MD-1 through tax credits and student debt relief, and fund rural hospitals and community clinics"
    snippet: "Incentivize health care providers to work and live in MD-1 through tax credits and student debt relief. Fund our rural hospitals and community clinics."
  - topic: "Farmland Preservation"
    value: "Would protect farmland from development"
    snippet: "Protect our farmland from development."
  - topic: "Chesapeake Bay"
    value: "Would hold out-of-state companies that pollute or overfish in the Chesapeake Bay accountable for the damage they cause"
    snippet: "Hold out-of-state companies that pollute or overfish in the Chesapeake Bay accountable for the damage they cause."
  - topic: "Agricultural Lending"
    value: "Would restore full funding to Farm Credit and USDA lending programs and support community banks serving the Delmarva Peninsula"
    snippet: "Restore full funding to Farm Credit/USDA lending programs"
  - topic: "Rural Transit"
    value: "Would secure federal investment to expand buses, shuttles and commuter lines serving the Eastern Shore and northern counties"
    snippet: "Secure federal investments to underwrite expansion of buses, shuttles, and commuter lines that serve the Eastern Shore and northern counties."
  - topic: "Rural Broadband"
    value: "Would support expanding broadband access across rural areas of MD-1"
    snippet: "Support efforts to expand broadband access across rural areas of MD-1."

  # "Tackle the affordability crisis"
  - topic: "Minimum Wage"
    value: "Would raise the federal minimum wage, arguing Maryland taxpayers currently subsidize out-of-state businesses that refuse to pay living wages"
    snippet: "Raise the federal minimum wage so that Maryland taxpayers are no longer subsidizing out-of-state businesses who refuse to pay their employees living wages."
  - topic: "Medicaid, Medicare & SNAP"
    value: "Would repeal cuts to Medicaid, Medicare, long-term care programs, SNAP and community grants"
    snippet: "Repeal cruel cuts to Medicaid, Medicare, long-term care programs, SNAP, and community grants that hit MD-1 hard."
  - topic: "Affordable Care Act"
    value: "Would protect and improve the ACA and allow public option plans in the marketplace to drive competition"
    snippet: "Protect and improve the Affordable Care Act (ACA) which helps Maryland families access healthcare. Allow public option plans in the ACA marketplace to drive competition."
  - topic: "Insurance Premiums"
    value: "Would hold insurers accountable for premium increases through oversight hearings requiring public justification of price hikes, and address executive compensation"
    snippet: "Hold oversight hearings to increase transparency and make insurers justify price hikes publicly. Address out-of-control executive compensation."
  - topic: "Drug Price Negotiation"
    value: "Would increase the number of drugs under the Medicare Drug Price Negotiation Program and speed up its timeline"
    snippet: "Increase the number of commonly used drugs under the Medicare Drug Price Negotiation Program and speed up the program’s timeline to drive costs down for those medications."
  - topic: "Offshore Wind & Energy Costs"
    value: "Would lower energy costs by supporting local and regional projects including US Wind's project off Ocean City"
    snippet: "Work to lower energy costs by supporting local and regional projects including US Wind’s Project off Ocean City."
  - topic: "Community Colleges & Trade Schools"
    value: "Would support the workforce by investing in community colleges and trade schools"
    snippet: "Support our workforce by investing in community colleges and trade schools."
  - topic: "Pre-K & Childcare"
    value: "Would strengthen universal pre-K and invest in childcare for working and middle class families"
    snippet: "Strengthen universal pre-K and invest in childcare for working and middle class families."
  - topic: "Housing & Mortgages"
    value: "Would expand federal rural mortgage programs and affordable mortgage programs for veterans, educators, healthcare workers and first responders"
    snippet: "Expand existing federal rural mortgage programs (USDA Direct, FHA, and VA loans) and affordable mortgage programs for veterans, educators, healthcare workers and first responders."

  # "Protect individual freedoms"
  - topic: "Abortion"
    value: "Would codify Roe v. Wade in federal law"
    snippet: "Codify Roe vs. Wade in Federal law so women across the country can access the care available in Maryland."
  - topic: "Immigration Reform"
    value: "Would pass bipartisan immigration reform protecting asylum seekers and securing borders, hold ICE and Border Patrol to the same procedures as other law enforcement, and focus enforcement on those who have committed crimes"
    snippet: "Pass bipartisan immigration reform legislation that protects asylum seekers and secures our borders. Hold ICE/Border Patrol accountable to the same police procedures as other law enforcement agencies. Focus immigration enforcement on those who have committed crimes."
  - topic: "Houses of Worship Security"
    value: "Would significantly increase federal security funding for houses of worship through the Nonprofit Security Grant Program"
    snippet: "Significantly increase federal funds for security at houses of worship (via the Nonprofit Security Grant Program administered by FEMA/DHS)."
  - topic: "Gun Safety"
    value: "Would implement universal background checks and close the \"boyfriend loophole\" to protect domestic violence victims"
    snippet: "Implement common-sense gun safety measures including universal background checks. Close the “boyfriend loophole” to protect victims of domestic violence."
  - topic: "Voting Rights"
    value: "Would protect the Voting Rights Act"
    snippet: "Protect the Voting Rights Act"
  - topic: "Surveillance & Data Privacy"
    value: "Would limit warrantless surveillance and enhance data privacy protections against corporations and government"
    snippet: "Implement limits on warrantless surveillance"

  # "Hold corrupt public officials and corporations accountable"
  - topic: "Congressional Stock Trading"
    value: "Would ban members of Congress, the Executive branch and their families from actively trading equities, options and cryptocurrency"
    snippet: "Implement a ban on members of Congress, Executive branch and their families actively trading equities, options, and cryptocurrency."
  - topic: "Corporate Taxes & Citizens United"
    value: "Would close tax code loopholes for mega-corporations and billionaires and end Citizens United"
    snippet: "Close tax code loopholes for mega-corporations and billionaires, and End Citizens United so we can get billionaire money out of politics."
  - topic: "Presidential Pardons"
    value: "Would rein in presidential pardon power, saying presidents of both parties have abused it"
    snippet: "Reign in Presidential pardon power. Presidents from both parties have abused this power."
  - topic: "Congressional Ethics"
    value: "Would strengthen the Office of Congressional Ethics"
    snippet: "Strengthen the Office of Congressional Ethics to make Congress clean up its own house."
  - topic: "Inspectors General"
    value: "Would restore Inspectors General in all federal agencies and the FBI's public corruption unit"
    snippet: "Restore Inspectors General in all federal agencies. Also restore the public corruption unit of the FBI."
  - topic: "Gerrymandering"
    value: "Would ban partisan gerrymandering at the federal level"
    snippet: "Ban partisan gerrymandering at the federal level. Politicians shouldn’t pick and choose their voters."

  # "Keep consumers safe"
  - topic: "Consumer Financial Protection"
    value: "Would restore staffing of the Consumer Financial Protection Bureau and the Justice Department's Civil Rights Division"
    snippet: "Restore staff of the Consumer Financial Protection Bureau and Civil Rights Division of the Justice Department."
  - topic: "Labor Rights & Wage Theft"
    value: "Would support legislation protecting the right to unionize and make wage theft a crime"
    snippet: "Support legislation that protects people’s rights to unionize. Make wage theft a crime."
  - topic: "Speculation Markets"
    value: "Would ensure guardrails protecting individuals in sports betting, prediction markets and options trading, citing excessive leverage and predatory practices"
    snippet: "Ensure guardrails exist to protect individuals in speculation markets (sports betting, prediction markets, options trading) where access to excessive leverage and predatory industry practices are leading to disastrous outcomes for users—especially young men."
  - topic: "Medical Debt"
    value: "Would increase protections for individuals affected by high-cost medical debt"
    snippet: "Increase protections for individuals impacted by high-cost medical debt."
  - topic: "AI Regulation"
    value: "Would reverse the ban on state-level AI regulation and pass federal legislation allowing innovation while protecting user information, jobs and national security"
    snippet: "Reverse ban on state level AI regulation and pass federal legislation that allows for innovation while protecting user information, jobs, and national security."
  - topic: "Digital Assets & Stablecoins"
    value: "Would implement guardrails around digital assets and stablecoins that protect consumers without stifling innovation"
    snippet: "Implement guardrails around digital assets and stablecoins that protects consumers without stifling innovation."
  - topic: "Consumer Contracts"
    value: "Would limit contract language waiving consumer protections, including arbitration clauses, class-action bans and non-compete clauses"
    snippet: "Limit contract language that waives substantive consumer protections (arbitration clauses, class-action bans, non-compete clauses etc.)"
  - topic: "Mobile Wallet Insurance"
    value: "Would require deposit insurance for mobile wallets and all accounts holding consumer funds, similar to FDIC insurance"
    snippet: "Require deposit insurance for mobile wallets and all accounts that hold consumer funds, similar to FDIC insurance."
  - topic: "Junk Fees"
    value: "Would limit junk fees and deceptive charges by vendors such as airlines and ticket sellers"
    snippet: "Limit junk fees and deceptive charges by vendors (airlines, ticket vendors etc.) that gouge and take advantage of consumers."
