bio:
  college:
    value: "B.A., University of Michigan; J.D., Wayne State University; M.P.A., Harvard University Kennedy School of Government"
    source_url: "https://ballotpedia.org/Maurice_Morton"
    snippet: "Morton obtained a B.A. from the University of Michigan, a J.D. from Wayne State University and an M.P.A. from Harvard University's Kennedy School of Government."
  employment_record:
    value: "Assistant prosecutor, Wayne County Prosecutor's Office; associate general counsel and director of community affairs, Detroit Medical Center; founder/partner, Simpson, Morton and Cross, PLLC; CEO, Detroit Academy of Arts & Sciences"
    source_url: "https://ballotpedia.org/Maurice_Morton"
    snippet: "Upon graduation, Morton worked as an assistant prosecutor in the Wayne County Prosecutor's Office. He then served as an associate general counsel and director of community affairs for the Detroit Medical Center. He later formed his own legal practice, Simpson, Morton and Cross, PLLC, where he was a partner at the time of his candidacy. Morton also serves at the CEO of Detroit Academy of Arts & Sciences."
  marital_status:
    value: "Married (wife: April); two children"
    source_url: "https://ballotpedia.org/Maurice_Morton"
    snippet: "Morton and wife, April, have two children."
