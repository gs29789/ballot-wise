platform_source_url: "https://www.walbergforcongress.com"
platform:
  - topic: "Creating Job and Economic Growth"
    value: "Focuses on expanding economic opportunities, encouraging job creation, and raising incomes for hardworking taxpayers."
    snippet: |
      Hardworking taxpayers are the strength of our country, and my focus is on expanding economic opportunities, encouraging job creation, and raising incomes. - Tim Walberg
  - topic: "Fiscal Responsibility"
    value: "Believes the federal government needs to live within its means."
    snippet: |
      The federal government needs to live within its means. - Tim Walberg
  - topic: "Affordable and Quality Health Care"
    value: "Prioritizes lowering prescription drug costs, developing disease cures, combating drug addiction, protecting people with pre-existing conditions, and making health care more affordable."
    snippet: |
      Lowering the cost of prescription drugs, developing cures for diseases, combating the drug addiction epidemic, protecting people with pre-existing conditions, and making healthcare more affordable are all important, life-touching priorities. - Tim Walberg
  - topic: "Defending Our Values"
    value: "Has voted repeatedly to support veterans and the military, religious freedom, the Second Amendment, and the right to life."
    snippet: |
      I have voted repeatedly to support our veterans and military, religious freedom, 2nd Amendment, and right to life. - Tim Walberg
  - topic: "Fixing the Biden Economy"
    value: "Supports reversing Biden-administration policies he says have hurt national security and prosperity; calls for \"commonsense solutions.\""
    snippet: |
      We must correct course by reversing the policies implemented by Joe Biden, which have cut into our nation's security and prosperity. It's time for commonsense solutions. - Tim Walberg
  - topic: "Protecting our National Security"
    value: "Supports strengthening U.S. resolve and capabilities against terrorist threats and dangerous regimes to keep Americans safe."
    snippet: |
      In the face of terrorist threats and dangerous regimes, we are strengthening our resolve and capabilities to keep the American people safe. - Tim Walberg
