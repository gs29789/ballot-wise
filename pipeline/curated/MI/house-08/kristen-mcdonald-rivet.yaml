platform:
  - topic: "Serving You in Congress"
    value: "Prioritizes lowering the cost of groceries, housing, and prescription drugs, and investing in child care; supports protecting Social Security from privatization, benefit cuts, or a higher retirement age."
    snippet: |
      Now, Kristen proudly serves Michigan's 8th District in Congress, where her top priority is to help level the playing field for working families. Kristen works with pragmatic leaders from both parties to lower the cost of groceries, housing and prescription drugs, and to invest in child care. She stands by Michigan seniors and protects Social Security from extremists seeking to privatize, reduce benefits, or raise the retirement age. She always stands on the side of people, not special interests.
  - topic: "Jobs, Workforce, and Security"
    value: "Supports workforce investment to prepare Michiganders for future jobs, believes good-paying jobs should be available without requiring a college degree, supports domestic manufacturing and taking a firm stance against China, and prioritizes safety, security, and constitutional freedoms."
    snippet: |
      Michigan needs more high-wage jobs. Kristen is helping us invest in our workforce to prepare Michiganders for the jobs of tomorrow, because while college isn't for everyone, good-paying jobs should be. She fights to make sure that we make things here in Michigan and stand up to China. And she prioritizes our safety, security, and hard-earned freedoms.
