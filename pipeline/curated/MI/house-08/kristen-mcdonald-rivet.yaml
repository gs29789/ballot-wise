bio_summary:
  value: |
    So after school, Kristen got to work helping families and children have more opportunities to thrive, with particular focus on making childcare more affordable. As the Executive Director of Michigan Head Start, Chief of Staff for Michigan's Department of Education and Vice President of the Skillman Foundation, Kristen worked to make big changes in Michigan to improve child care and education outcomes for children, revitalize communities, increase youth development programs, and create public policy that levels the playing field.

    Before representing our community in Congress, Kristen served in the Michigan State Senate, where she has worked with both Democrats and Republicans to make progress for Michigan families, workers and kids. She successfully led the charge to pass the largest tax cut for working families in Michigan's history, repealed the state's burdensome retirement tax, and has introduced plans to lower critical costs, like prescription drugs, housing, and child care. Kristen has fought to protect abortion rights for women, and, in one of her first acts in the State Senate, passed a commonsense gun violence prevention bill that requires safe storage of firearms around children.
