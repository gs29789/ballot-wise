platform_source_url: "https://budzinski.house.gov/resources"
platform:
  - topic: "Agriculture"
    value: "Serves on the House Agriculture Committee representing Central and Southern Illinois farmland; focused on revitalizing rural America, protecting the farm safety net, maintaining nutrition programs, and investing in conservation."
    snippet: |
      As a native of Downstate Illinois and the Representative for some of our nation's most productive farmland, Nikki is proud to serve on the House Agriculture Committee to give family farmers in Central and Southern Illinois an important seat at the table in Washington. In Congress, Nikki is focused on revitalizing rural America, protecting the farm safety net, maintaining critical nutrition programs and investing in conservation. You can learn more about the upcoming Farm Bill here.
  - topic: "Energy & Utility Affordability"
    value: "Co-chairs the House Democrats' Gas & Utility Affordability Working Group, appointed by Leader Hakeem Jeffries, gathering ideas to lower gas and utility costs; supports an 'all-of-the-above' energy approach she says creates jobs, reduces emissions, and strengthens energy independence."
    snippet: |
      I'm honored that Leader Jeffries has tasked Rep. Levin and me with addressing one of the most important issues affecting Americans' pocketbooks: gas and utility prices. We've watched this year as the President's reckless policies have allowed those costs to skyrocket. Our solutions aren't just about reversing that course—they're about listening to people on the ground and advancing an all-of-the-above energy approach that creates jobs, reduces emissions, strengthens our energy independence and, most importantly, lowers costs. That's what today's roundtable was about and marked an important first step as we work to develop a day-one agenda that can deliver on those goals.
  - topic: "Protecting Federal Research & Grant Funding"
    value: "Led two letters to OMB (signed by 125 and 15 members of Congress respectively) opposing proposed rule changes she says would let political appointees override merit-based, peer-reviewed federal grantmaking, including agricultural research grants; has helped secure federal research funding for the University of Illinois Urbana-Champaign."
    snippet: |
      This proposal would represent the most sweeping and destructive transformation of the federal financial assistance system in modern history and would subordinate nonpartisan, merit-based grantmaking to political control, exposing the entire framework to serious constitutional challenge. With more than $1 trillion in annual Federal awards at stake, the consequences would be felt by every state, federally recognized tribe, city, county, research university, hospital, and countless nonprofits, community organizations, and private firms that deliver critical scientific studies and essential public service.
  - topic: "Postal Service Reliability"
    value: "Co-founded the bipartisan Congressional Postal Service Caucus in 2025; presses USPS leadership directly, including facility tours and meetings with local officials, for more reliable mail delivery in the Springfield area and nationally."
    snippet: |
      Every community across the country – from sprawling urban areas to rural farm towns – deserves reliable and efficient postal service. That's why I've made it a priority in Congress to find solutions to strengthen delivery, protect our postal employees and ensure communities get the service they deserve. Today's meeting with Springfield USPS leadership was a productive conversation about the current state of service and the steps being taken to improve delivery. I'll continue holding the Postal Service accountable, standing up for its workers and demanding reliable service across our communities.
