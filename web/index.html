    <title>Ballot-Wise — Congress, compared</title>
    <!-- Static baseline for crawlers/link-unfurlers that never run this
         app's JS (Twitter/X, Facebook, iMessage, Slack all fetch raw HTML).
         App.jsx's own useEffect overwrites the title/description tags once
         a race or profile is open, for the browser tab and for Googlebot's
         JS-rendering pass — but that update never reaches a non-JS fetch,
         so this static copy is what every shared homepage link actually
         shows. The canonical is safe to pin to "/" now that every race has
         its own clean path (/tx/senate, /nc/house-4) with its own canonical
         from functions/[state]/[race].js; legacy ?state=..&district=.. links
         are 301'd to those paths by functions/index.js, so nothing
         indexable is left that this tag would wrongly collapse into "/". -->
    <link rel="canonical" href="https://ballot-wise.com/" />
    <meta name="description" content="Get ready to vote in the 2026 midterms — compare every U.S. House and Senate candidate on your ballot, side by side: voting records, campaign finance, and public statements, all sourced from official records. Non-partisan." />
